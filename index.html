<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Body Day — a day in the life of the human body</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,300..600;1,7..72,400&family=Schibsted+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<!--
================================================================================
 BODY DAY — ARCHITECTURE NOTES
================================================================================
 Everything lives in this one file, organised as independent layers so each
 can grow (or move to its own file) without touching the others.
 Structure follows the Oak Year template.

 1. DATA (JSON blocks in <script type="application/json">)
    #body-content  topics → phases → levels → text. The schema is the contract.
    #body-glossary term → definition + match forms. Terms are auto-linked.
    #body-hours    one short "what's happening now" note per hour (24).

 2. CONFIG          LEVELS, PHASES, SCHEDULE (the day plan) and PHYSIO keyframes:
                   sparse [hour, value] pairs per channel, smoothly interpolated
                   and wrapping around midnight. Add a channel: add keyframes,
                   read it in Scene / Vitals. Physio.at() also derives cardiac
                   output, ventilation, venous O₂ (Fick) and the organ flow split. Missing text falls back to the
                   nearest lower level.

 3. STORE           Single source of truth {hour, level, topic, playing}.

 4. SCENE           Stylised see-through body plus a window showing the sky.
                   Renders physiology → SVG attributes. RHYTHM keeps the beat and
                   breath phases (breath waveform, RSA, ventricular volume), and
                   PARTICLES animates blood, food, breath, sweat and Zzz. Blood
                   cells run the CIRC network: lungs ↔ heart ↔ each organ.

 5. TOPICS          App.registerTopic({id, focus, side, ring, illustrate, simulate}).
                   Illustrations are pure functions ctx → SVG string;
                   ctx.mark() adds a numbered, level-aware marker (label shown on hover/click).
                   simulate(k, ctx) brings the picture to life: it returns
                   tick(dt, ph, Rhythm), driven by the beat/breath clock and the
                   physiology of the hour (see "simulation helpers").

 6. VITALS          Live readout: ECG, breathing, glucose trace, temperature,
                   blood pressure, cardiac output, blood O₂, hormones.

 7. UI              Panel, timeline, level switch, glossary tooltips.

 Values are typical for a healthy adult and simplified for teaching; this is
 not medical advice.
================================================================================
-->
<style>
:root{
  --bg:#EFEAE5; --surface:#F8F5F1; --surface-2:#E6DFD8; --ink:#261D1B; --muted:#6D615B;
  --line:#DCD2C9; --line-strong:#A99B91;
  --skin:#EBCDB6; --skin-line:#C9A186; --vessel:#C2414B; --vein:#4F5FB0;
  --accent:#2f8f83;
  --serif:"Literata", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --sans:"Schibsted Grotesk", "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
  --panel-w:440px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151210; --surface:#1C1815; --surface-2:#29221E; --ink:#EEE6DE; --muted:#A8998F;
    --line:#342B26; --line-strong:#5A4B42;
    --skin:#5E4A3F; --skin-line:#86695A; --vessel:#E0606A; --vein:#8090E0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#151210; --surface:#1C1815; --surface-2:#29221E; --ink:#EEE6DE; --muted:#A8998F;
  --line:#342B26; --line-strong:#5A4B42;
  --skin:#5E4A3F; --skin-line:#86695A; --vessel:#E0606A; --vein:#8090E0;
  color-scheme: dark;
}
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
*,*::before,*::after{ box-sizing:inherit; }
html{ height:100%; }
body{
  height:100%; margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--sans); font-size:15px; line-height:1.45;
  display:grid; grid-template-rows:auto 1fr; -webkit-font-smoothing:antialiased;
}
button{ font:inherit; color:inherit; }
:focus-visible{ outline:2px solid var(--ink); outline-offset:2px; border-radius:4px; }

/* ---------- Header ---------- */
.top{ display:flex; align-items:center; justify-content:space-between; gap:16px; padding:14px 24px; border-bottom:1px solid var(--line); }
.brand{ display:flex; align-items:center; gap:12px; min-width:0; }
.brand svg{ flex:none; }
.brand-title{ font-family:var(--serif); font-size:21px; font-weight:500; letter-spacing:-0.01em; margin:0; line-height:1.1; }
.brand-sub{ margin:2px 0 0; color:var(--muted); font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.levels{ display:flex; align-items:center; gap:10px; }
.levels-label{ color:var(--muted); font-size:13px; }
.seg{ display:flex; background:var(--surface-2); border-radius:999px; padding:3px; }
.seg button{ border:0; background:transparent; padding:6px 13px; border-radius:999px; cursor:pointer; font-size:13px; font-weight:500; color:var(--muted); white-space:nowrap; transition:background .2s, color .2s; }
.seg button[aria-checked="true"]{ background:var(--surface); color:var(--ink); box-shadow:0 0 0 1px var(--line); }
.seg .short{ display:none; }

/* ---------- Main layout ---------- */
.main{ display:grid; grid-template-columns:minmax(0,1fr) var(--panel-w); min-height:0; }
.stage{ position:relative; display:grid; grid-template-rows:minmax(0,1fr) auto; grid-template-columns:minmax(0,1fr); min-height:0; min-width:0; overflow:hidden; }
.scene-wrap{ grid-row:1; grid-column:1; position:relative; min-height:0; }
#scene{ position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:manipulation; }

.moment{ position:absolute; left:28px; top:22px; max-width:min(330px, 55%); pointer-events:none; z-index:2; transition:opacity .35s; }
.moment.off{ opacity:0; }
.moment-time{ font-family:var(--serif); font-weight:300; font-size:clamp(44px, 6vw, 76px); line-height:.95; letter-spacing:-0.03em; margin:0; font-variation-settings:"opsz" 72; font-variant-numeric:tabular-nums lining-nums; }
.moment-phase{ margin:10px 0 4px; font-size:13px; font-weight:600; display:flex; align-items:center; gap:8px; }
.moment-phase::before{ content:""; width:9px; height:9px; border-radius:50%; background:var(--accent); transition:background .4s; }
.moment-note{ margin:0; color:var(--muted); font-size:14px; line-height:1.45; }

.back{
  position:absolute; right:18px; top:18px; z-index:3; border:1px solid var(--line); background:var(--surface); border-radius:999px;
  padding:7px 14px 7px 11px; font-size:13px; font-weight:500; cursor:pointer; display:flex; align-items:center; gap:6px;
  opacity:0; transform:translateY(-4px); pointer-events:none; transition:opacity .25s, transform .25s;
}
.back.on{ opacity:1; transform:none; pointer-events:auto; }

/* Hotspots */
.hotspots{ position:absolute; inset:0; pointer-events:none; z-index:2; transition:opacity .3s; }
.hotspots.off{ opacity:0; }
.hotspots.off .hs{ pointer-events:none; }
.hs{ position:absolute; left:0; top:0; pointer-events:auto; cursor:pointer; display:flex; align-items:center; gap:7px; border:0; background:none; padding:0; transform:translate(-11px,-11px); }
.hs-dot{ width:22px; height:22px; border-radius:50%; position:relative; flex:none; background:var(--surface); box-shadow:0 0 0 1.5px var(--ink) inset; }
.hs-dot::after{ content:""; position:absolute; inset:6px; border-radius:50%; background:var(--ink); transition:inset .2s; }
.hs:hover .hs-dot::after, .hs:focus-visible .hs-dot::after{ inset:4px; }
.hs-label{ font-size:12.5px; font-weight:500; background:var(--surface); padding:3px 9px; border-radius:6px; box-shadow:0 0 0 1px var(--line); white-space:nowrap; }
.hs.flip{ flex-direction:row-reverse; transform:translate(calc(-100% + 11px),-11px); }

/* ---------- Vitals ---------- */
.vitals{
  grid-row:1; grid-column:1; align-self:end; justify-self:start; z-index:3; margin:0 0 14px 20px;
  display:grid; grid-template-columns:repeat(2, 112px); gap:6px;
}
.vt{ background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:6px 9px 7px; min-width:0; }
.vt-top{ display:flex; justify-content:space-between; align-items:center; gap:6px; height:22px; }
.vt-label{ font-size:11px; color:var(--muted); font-weight:500; white-space:nowrap; }
.vt-val{ display:flex; align-items:baseline; gap:3px; white-space:nowrap; }
.vt-val b{ font-family:var(--serif); font-size:24px; font-weight:400; line-height:1.1; font-variant-numeric:tabular-nums lining-nums; letter-spacing:-.01em; }
.vt-val span{ font-size:11px; color:var(--muted); }
.vt-sub{ font-size:10.5px; color:var(--muted); font-variant-numeric:tabular-nums; }
#ecg{ width:56px; height:22px; display:block; }
.breath{ width:22px; height:22px; border-radius:50%; box-shadow:0 0 0 1px var(--line-strong) inset; display:grid; place-items:center; }
.breath i{ width:18px; height:18px; border-radius:50%; background:var(--accent); opacity:.5; display:block; transform:scale(.6); }
.gtrace{ width:56px; height:22px; display:block; overflow:visible; }
.gtrace .tr{ fill:none; stroke:var(--muted); stroke-width:1.2; }
.gtrace .now{ fill:var(--accent); }
.gtrace .band{ fill:var(--surface-2); }
.tbar{ position:relative; width:56px; height:5px; border-radius:3px; background:linear-gradient(90deg,#6b9bd1,#e5c46b,#e0533d); }
.tbar i{ position:absolute; top:-3px; width:3px; height:11px; border-radius:2px; background:var(--ink); transform:translateX(-50%); transition:left .2s; }
.vt-wide{ grid-column:1 / -1; display:grid; grid-template-columns:auto 1fr; gap:3px 8px; align-items:center; padding:7px 9px; }
.hbar{ height:5px; border-radius:3px; background:var(--surface-2); overflow:hidden; }
.hbar i{ display:block; height:100%; border-radius:3px; transition:width .2s; }
#hCort{ background:#e0a43a; } #hMel{ background:#6c6fc4; } #hIns{ background:#3f9a5a; } #hGcg{ background:#8a5cc4; }
.vt-circ{ gap:1px 8px; padding:5px 9px 6px; }
.vt-circ .vt-val{ justify-content:flex-end; }
.vt-circ .vt-val b{ font-size:16px; }
#vSat{ background:linear-gradient(90deg,#d63340,#5a68bd); -webkit-background-clip:text; background-clip:text; color:transparent; }

/* ---------- Timeline ---------- */
.timeline{ grid-row:2; grid-column:1; display:grid; grid-template-columns:auto 1fr; gap:2px 16px; align-items:center; padding:12px 28px 16px; border-top:1px solid var(--line); }
.play{ grid-row:span 2; width:40px; height:40px; border-radius:50%; border:1px solid var(--line-strong); background:var(--surface); cursor:pointer; display:grid; place-items:center; }
.play svg{ width:14px; height:14px; fill:var(--ink); }
.range{ position:relative; height:26px; display:flex; align-items:center; }
.daybar{ position:absolute; left:10px; right:10px; top:50%; height:6px; margin-top:-3px; border-radius:3px; background:var(--line); overflow:hidden; pointer-events:none; }
.daybar i{ position:absolute; top:0; bottom:0; background:var(--c); opacity:.8; }
.range input{ position:relative; width:100%; margin:0; appearance:none; -webkit-appearance:none; background:transparent; height:26px; cursor:pointer; }
.range input::-webkit-slider-runnable-track{ height:6px; background:transparent; }
.range input::-moz-range-track{ height:6px; background:transparent; }
.range input::-webkit-slider-thumb{ -webkit-appearance:none; width:20px; height:20px; border-radius:50%; margin-top:-7px; background:var(--accent); border:3px solid var(--surface); box-shadow:0 0 0 1px var(--line-strong); }
.range input::-moz-range-thumb{ width:14px; height:14px; border-radius:50%; background:var(--accent); border:3px solid var(--surface); box-shadow:0 0 0 1px var(--line-strong); }
.hours{ position:relative; height:20px; }
.hours button{ position:absolute; top:0; transform:translateX(-50%); border:0; background:none; padding:1px 4px; cursor:pointer; color:var(--muted); font-size:12px; border-radius:4px; font-variant-numeric:tabular-nums; }
.hours button[aria-current="true"]{ color:var(--ink); font-weight:600; }

/* ---------- Panel ---------- */
.panel{ border-left:1px solid var(--line); background:var(--surface); overflow-y:auto; min-height:0; }
.panel-inner{ padding:26px 28px 40px; }
.panel-inner.enter{ animation:enter .35s ease both; }
@keyframes enter{ from{ opacity:0; transform:translateY(6px);} to{ opacity:1; transform:none; } }
.crumb{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px; }
.link{ border:0; background:none; padding:4px 0; cursor:pointer; color:var(--muted); font-size:13px; font-weight:500; display:inline-flex; align-items:center; gap:5px; }
.link:hover{ color:var(--ink); }
.when{ color:var(--muted); font-size:13px; font-variant-numeric:tabular-nums; }
.panel h2{ font-family:var(--serif); font-weight:400; font-size:34px; line-height:1.05; letter-spacing:-0.02em; margin:0 0 6px; font-variation-settings:"opsz" 48; }
.lede{ margin:0 0 18px; color:var(--muted); font-size:14px; }
figure.ill{ position:relative; margin:0 0 6px; background:var(--bg); border-radius:14px; padding:10px 8px 6px; }
figure.ill svg{ display:block; width:100%; height:auto; }
.follow{ margin:20px 0 4px; }
.follow-label{ font-size:13px; color:var(--muted); margin:0 0 8px; }
.tabs{ display:grid; grid-template-columns:repeat(4,1fr); gap:4px; background:var(--surface-2); border-radius:10px; padding:3px; }
.tabs button{ border:0; background:none; border-radius:8px; padding:7px 0; font-size:13px; font-weight:500; color:var(--muted); cursor:pointer; }
.tabs button[aria-pressed="true"]{ background:var(--surface); color:var(--ink); box-shadow:0 0 0 1px var(--line); }
.reading{ margin-top:22px; }
.reading-level{ font-size:13px; font-weight:600; margin:0 0 6px; display:flex; align-items:center; gap:8px; }
.pips{ display:inline-flex; gap:3px; }
.pips i{ width:14px; height:4px; border-radius:2px; background:var(--line); }
.pips i.on{ background:var(--ink); }
.reading p.text{ font-family:var(--serif); font-size:16.5px; line-height:1.68; margin:0; max-width:62ch; font-variation-settings:"opsz" 16; }
.depth{ display:flex; gap:8px; flex-wrap:wrap; margin-top:16px; }
.chip{ border:1px solid var(--line-strong); background:transparent; border-radius:999px; padding:6px 13px; font-size:13px; font-weight:500; cursor:pointer; }
.chip:hover{ background:var(--surface-2); }
.chip.primary{ background:var(--ink); color:var(--surface); border-color:var(--ink); }
.chip.primary:hover{ opacity:.88; background:var(--ink); }
.related{ margin-top:26px; padding-top:18px; border-top:1px solid var(--line); }
.related p{ margin:0 0 8px; font-size:13px; color:var(--muted); }
.term{ border:0; background:none; padding:0; font:inherit; color:inherit; cursor:help; text-decoration:underline; text-decoration-style:dotted; text-decoration-color:var(--line-strong); text-underline-offset:3px; text-decoration-thickness:1.5px; }
.term:hover{ text-decoration-color:var(--ink); }
#tip{ position:fixed; z-index:20; max-width:280px; background:var(--ink); color:var(--surface); padding:10px 12px; border-radius:10px; font-size:13px; line-height:1.45; pointer-events:none; opacity:0; transform:translateY(4px); transition:opacity .15s, transform .15s; }
#tip.on{ opacity:1; transform:none; }
#tip b{ display:block; font-family:var(--serif); font-weight:500; font-size:15px; margin-bottom:2px; }

/* Intro view */
.intro h2{ font-size:30px; }
.intro .lede{ font-family:var(--serif); font-size:16px; line-height:1.6; color:var(--ink); }
.sched{ display:flex; flex-wrap:wrap; gap:6px; margin:0 0 22px; }
.sched button{ border:1px solid var(--line); background:var(--bg); border-radius:10px; padding:5px 10px 6px; cursor:pointer; display:grid; grid-template-columns:auto auto; gap:0 7px; align-items:center; text-align:left; }
.sched button::before{ content:""; grid-row:span 2; width:8px; height:8px; border-radius:50%; background:var(--c); }
.sched b{ font-size:13px; font-weight:600; }
.sched span{ font-size:11.5px; color:var(--muted); font-variant-numeric:tabular-nums; }
.sched button:hover{ border-color:var(--line-strong); }
.topic-list{ list-style:none; margin:10px 0 0; padding:0; border-top:1px solid var(--line); }
.topic-list button{ width:100%; text-align:left; border:0; border-bottom:1px solid var(--line); background:none; cursor:pointer; display:grid; grid-template-columns:auto 1fr auto; gap:2px 14px; align-items:center; padding:12px 2px; }
.topic-list button:hover .tl-name{ text-decoration:underline; text-underline-offset:3px; }
.tl-glyph{ grid-row:span 2; width:34px; height:34px; border-radius:50%; background:var(--surface-2); display:grid; place-items:center; }
.tl-glyph svg{ width:22px; height:22px; }
.tl-name{ font-weight:600; font-size:14.5px; }
.tl-blurb{ grid-column:2; color:var(--muted); font-size:13px; }
.tl-arrow{ grid-row:span 2; grid-column:3; color:var(--muted); }
.hint{ margin-top:18px; font-size:13px; color:var(--muted); }

/* Illustration styling */
.ill .mag-bg{ fill:var(--surface); }
.ill .mag-ring{ fill:none; stroke:var(--ink); stroke-width:1.5; }
.ill .loupe{ fill:none; stroke:var(--ink); stroke-width:1; stroke-dasharray:3 3; opacity:.6; }
.ill .mk{ cursor:pointer; outline:none; }
.ill .mk.on circle, .ill .mk:focus-visible circle{ stroke:var(--accent, var(--ink)); stroke-width:3; }
.mk-tip{ position:absolute; z-index:3; max-width:220px; padding:6px 9px; border-radius:8px; background:var(--ink); color:var(--surface);
  font-size:12.5px; line-height:1.35; pointer-events:none; opacity:0; transform:translate(-50%, calc(-100% - 12px)); transition:opacity .12s; }
.mk-tip.below{ transform:translate(-50%, 12px); }
.mk-tip.on{ opacity:1; }
.ill .mk circle{ fill:var(--ink); stroke:var(--bg); stroke-width:2; }
.ill .mk text{ fill:var(--bg); font:600 9.5px var(--sans); text-anchor:middle; }
.ill .ill-t{ fill:var(--ink); font:600 10px var(--sans); }
.ill .sim{ pointer-events:none; }

/* ---------- Scene styling ---------- */
.limb-o{ fill:none; stroke:var(--skin-line); stroke-linecap:round; }
.limb{ fill:none; stroke:var(--skin); stroke-linecap:round; }
.skin{ fill:var(--skin); stroke:var(--skin-line); stroke-width:2; }
.shadow{ fill:var(--line); }
.win-frame{ fill:none; stroke:var(--line-strong); stroke-width:8; }
.win-bar{ stroke:var(--line-strong); stroke-width:4; opacity:.8; }
.vessel{ fill:none; stroke:var(--vessel); stroke-width:3; opacity:.28; stroke-linecap:round; stroke-linejoin:round; }
.vessel.dx{ stroke:var(--vein); }
.rbc{ stroke:#00000022; stroke-width:.6; }
.face{ fill:none; stroke:var(--ink); stroke-width:2.6; stroke-linecap:round; }
.zz{ fill:var(--muted); font:italic 500 22px var(--serif); }
.puff{ fill:none; stroke:var(--muted); stroke-width:1.5; }
.focus-ring{ fill:none; stroke:var(--ink); stroke-width:1.6; stroke-dasharray:4 4; opacity:0; transition:opacity .4s .5s; vector-effect:non-scaling-stroke; }
.focus-ring.on{ opacity:.75; }

/* ---------- Responsive ---------- */
@media (max-width: 1100px){ :root{ --panel-w:380px; } .levels-label{ display:none; } }
@media (max-width: 860px){
  body{ height:auto; display:block; }
  .main{ display:block; }
  .stage{ grid-template-rows:minmax(380px, 62svh) auto auto; }
  .vitals{ grid-row:2; margin:0; padding:10px 16px 2px; justify-self:stretch; align-self:start; grid-template-columns:repeat(4, minmax(0,1fr)); }
  .vt-wide{ grid-template-columns:auto 1fr auto 1fr; }
  .timeline{ grid-row:3; padding:10px 16px 14px; gap:2px 12px; }
  .panel{ border-left:0; border-top:1px solid var(--line); overflow:visible; }
  .panel-inner{ padding:24px 20px 48px; }
  .top{ padding:12px 16px; flex-wrap:wrap; }
  .brand-sub{ display:none; }
  .seg .long{ display:none; } .seg .short{ display:inline; }
  .seg button{ padding:6px 11px; }
  .moment{ left:18px; top:14px; }
  .moment-note{ font-size:13px; }
  .hs-label{ font-size:12px; }
}
@media (max-width: 480px){
  .vitals{ grid-template-columns:repeat(2, minmax(0,1fr)); }
  .vt-wide{ grid-template-columns:auto 1fr; }
  .moment-note{ display:none; }
}
@media (prefers-reduced-motion: reduce){
  *{ animation:none !important; transition:none !important; }
}
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <svg width="34" height="34" viewBox="-50 -50 100 100" aria-hidden="true"><path id="brandHeart" fill="var(--accent)" d="M0 34 C-30 14 -44 -4 -40 -20 C-36 -36 -14 -40 0 -24 C14 -40 36 -36 40 -20 C44 -4 30 14 0 34Z"/></svg>
    <div>
      <h1 class="brand-title">Body Day</h1>
      <p class="brand-sub">A day in the life of the human body</p>
    </div>
  </div>
  <div class="levels">
    <span class="levels-label" id="levelsLabel">Reading level</span>
    <div class="seg" role="radiogroup" aria-labelledby="levelsLabel" id="levelSeg"></div>
  </div>
</header>

<div class="main">
  <section class="stage" aria-label="The human body through the day">
    <div class="scene-wrap" id="sceneWrap">
      <svg id="scene" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid meet" role="img" aria-label="A see-through human body at the selected time of day"></svg>
      <div class="moment" aria-live="polite">
        <p class="moment-time" id="mTime">07:30</p>
        <p class="moment-phase" id="mPhase">Rest</p>
        <p class="moment-note" id="mNote"></p>
      </div>
      <div class="hotspots" id="hotspots"></div>
      <button class="back" id="backBtn" type="button">
        <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M9 2 4 7l5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Whole body
      </button>

          "hs": "Two systems control sleep. One is a body clock in the hypothalamus that follows light and dark. The other is sleep pressure from adenosine, which builds up the longer you’re awake. At night the pineal gland releases melatonin, a signal that it’s dark outside. Deep slow-wave sleep helps lock in memories. REM sleep, when most vivid dreams happen, comes in longer bouts toward morning.",
          "college": "The suprachiasmatic nucleus (SCN) gets light information from melanopsin-containing retinal ganglion cells and uses it to entrain the circadian system. Through a multisynaptic sympathetic pathway, it drives melatonin release from the pineal gland. Homeostatic sleep pressure tracks adenosine accumulation; caffeine works by blocking adenosine receptors. NREM sleep is dominated by slow oscillations, spindles and hippocampal sharp-wave ripples, which support memory consolidation. REM sleep shows cortical activation together with muscle atonia.",

          "hs": "Neurons communicate with electrical impulses called action potentials. At the end of each neuron, the signal crosses a tiny gap, the synapse, when the neuron releases chemicals called neurotransmitters. The brain runs almost entirely on glucose from the blood and can store very little of it. It needs a steady supply of blood, sugar and oxygen every second.",
          "college": "The adult brain uses about 20% of resting oxygen uptake and around 120 g of glucose a day. Much of that energy powers the Na⁺/K⁺-ATPase, which restores ion gradients after action potentials and synaptic transmission. Glutamate is the main excitatory neurotransmitter and GABA the main inhibitory one. Autoregulation keeps cerebral blood flow fairly constant across a wide range of blood pressures.",
          "phd": "Energy budgets (Attwell & Laughlin 2001) attribute most of the signalling cost in cortex to postsynaptic currents and action potentials. The ATP is spent mostly by the Na⁺/K⁺-ATPase reversing ion fluxes. Neurovascular coupling links local activity to blood flow, and this is the basis of the BOLD fMRI signal. The astrocyte–neuron lactate shuttle hypothesis proposes that astrocytes pass lactate to neurons. The direction and size of lactate flux in vivo are still contested."

          "hs": "The hypothalamus is the brain’s hunger centre. Before a meal, the stomach releases ghrelin, a hormone that makes you hungry. As food arrives, stretch receptors and gut hormones such as GLP-1 and PYY signal fullness, partly through the vagus nerve. Over the long term, leptin from fat tissue tells the brain how much energy the body has stored.",
          "college": "In the arcuate nucleus, AgRP/NPY neurons drive hunger and POMC neurons promote satiety. Ghrelin activates AgRP/NPY neurons, while leptin, insulin and GLP-1 favour POMC neurons. Vagal afferents carry stretch and nutrient signals from the gut to the nucleus of the solitary tract in the brainstem. Reward circuits, including dopamine release in the nucleus accumbens, add a hedonic layer that can override homeostatic fullness signals.",
          "phd": "Optogenetic and chemogenetic work (e.g. Aponte et al. 2011; Betley et al. 2015) showed that AgRP neurons are enough to drive feeding. These neurons are inhibited quickly when food is detected by the senses, before any nutrients are absorbed, which points to anticipatory regulation. Gut–brain signalling also runs through enteroendocrine ‘neuropod’ cells that synapse onto vagal afferents (Kaelberer et al. 2018). GLP-1 receptor agonists such as semaglutide reduce intake largely through central pathways, but their relevant sites of action are still being mapped."

          "hs": "Movements are planned in the frontal lobe, sent out from the motor cortex, and fine-tuned by the cerebellum and basal ganglia. During exercise the sympathetic nervous system, the ‘fight or flight’ system, speeds up the heart and breathing. Exercise releases endorphins and endocannabinoids, which may cause the ‘runner’s high’. Over time, regular exercise helps the hippocampus, a memory centre, build new connections.",
          "college": "Upper motor neurons in the primary motor cortex project through the corticospinal tract to lower motor neurons. These recruit motor units in order of size (Henneman’s size principle). Heart rate and ventilation during exercise are set by central command from the brain together with feedback from metaboreceptors and mechanoreceptors in muscle. In animal studies, aerobic training raises brain-derived neurotrophic factor (BDNF), which supports synaptic plasticity and hippocampal neurogenesis.",

        "meal": {
          "ms": "After a meal, sugar from your food arrives at the liver. The liver soaks some of it up and stores it as glycogen for later, like putting leftovers in the fridge. It also sends bile to your intestines to help break down the fats in your meal.",
          "hs": "When blood sugar rises after a meal, the pancreas releases insulin. Insulin tells the liver to stop releasing glucose and to store it as glycogen instead. Sugar beyond what can be stored can be turned into fat. The gallbladder, a small pouch under the liver, squeezes out bile. Bile breaks fat into tiny droplets so enzymes can digest it.",
          "college": "Insulin concentrations in the portal vein are 2–3 times higher than in the general circulation, so the liver is insulin’s first target. Through Akt and FOXO1, insulin activates glycogen synthase and suppresses gluconeogenic genes such as PEPCK and G6Pase. The liver takes up about a third of an oral glucose load. Bile salts emulsify fats and form micelles. About 95% of them are reabsorbed in the ileum and return to the liver, the enterohepatic circulation.",
          "phd": "‘Selective hepatic insulin resistance’ is a puzzle of type 2 diabetes. Insulin fails to suppress gluconeogenesis, yet it still drives lipogenesis through SREBP-1c, which contributes to fatty liver and hypertriglyceridaemia. Proposed explanations include a split in insulin signalling downstream of Akt/mTORC1 and a ‘substrate push’ of fatty acids. Another is that insulin acts indirectly through adipose lipolysis, which limits the supply of gluconeogenic substrate. Bile acids also act as hormones through the FXR and TGR5 receptors."
        },
        "exercise": {
          "ms": "When you exercise, your muscles burn through sugar quickly. Your liver helps by releasing more sugar from its stores into your blood, so your muscles and brain don’t run out. On a long run, the liver is one of your most important helpers.",
          "hs": "During exercise, glucagon and adrenaline signal the liver to break down glycogen fast and release glucose. The liver can release glucose several times faster than at rest. Muscles produce lactate, which travels to the liver and is turned back into glucose. When glycogen stores run low on a long race, athletes can ‘hit the wall’.",
          "college": "During exercise, hepatic glucose production can increase two- to five-fold. A falling insulin:glucagon ratio, sensed directly in the portal vein, matches it to muscle uptake. The Cori cycle returns lactate to the liver for gluconeogenesis, and the glucose–alanine cycle does the same for amino-acid nitrogen. Prolonged exercise also increases fatty-acid oxidation and ketone production in the liver.",
          "phd": "Wasserman and colleagues showed in dogs that the exercise-induced rise in glucagon accounts for most of the increase in hepatic glucose production. The fall in insulin is what allows this rise. Catecholamines matter more during intense or prolonged exercise. Eating carbohydrate at high rates during exercise can largely suppress hepatic glucose output (Jeukendrup et al. 1999). This is the reason carbohydrate-feeding strategies help spare liver glycogen in endurance events."
        }
      }
    },
    "pancreas": {
      "name": "Pancreas",
      "blurb": "Enzymes for digestion, hormones for blood sugar",
      "related": ["liver", "gut", "muscles"],
      "phases": {
        "sleep": {
          "ms": "The pancreas is a long, flat organ tucked behind your stomach. At night, while you’re not eating, it releases a hormone called glucagon. Glucagon tells your liver to put sugar into your blood, so your blood sugar doesn’t drop too low before breakfast.",
          "hs": "The pancreas has two jobs: it makes digestive enzymes, and it makes hormones in tiny clusters of cells called islets. Alpha cells in the islets release glucagon, which raises blood sugar. Beta cells release insulin, which lowers it. Overnight, insulin is low and glucagon helps keep blood glucose at around 4–5.5 mmol/L (70–100 mg/dL).",
          "college": "Islets of Langerhans make up only 1–2% of pancreatic mass, yet they receive a disproportionate share of its blood flow. Basal insulin secretion continues during fasting, pulsing roughly every 5–10 minutes. It restrains lipolysis and hepatic glucose output. Insulin sensitivity is lower in the evening and at night than in the morning, so the same meal produces a bigger glucose rise late in the day.",
          "phd": "β-cells have their own circadian clocks. Deleting Clock or Bmal1 in mouse β-cells impairs insulin exocytosis and causes diabetes (Marcheva et al. 2010). Pulsatile insulin delivery to the liver works better than continuous delivery, and losing this pulsatility is an early feature of type 2 diabetes. Paracrine signalling also shapes counter-regulatory responses, for example somatostatin from δ-cells and insulin acting on α-cells."
        },
        "rest": {
          "ms": "Between meals, your pancreas quietly measures your blood sugar. It releases just enough of two hormones to keep it steady, a bit like a thermostat for sugar instead of temperature. It also stores up digestive juices for your next meal.",
          "hs": "Blood sugar is kept in a narrow range by negative feedback. When it rises, beta cells release insulin; when it falls, alpha cells release glucagon. In type 1 diabetes, the immune system destroys the beta cells, so people need insulin injections. In type 2 diabetes, the body stops responding well to insulin and the beta cells can’t keep up.",
          "college": "The exocrine pancreas, made of acinar and duct cells, is about 98% of the organ. It secretes 1–1.5 L of juice a day containing amylase, lipase and bicarbonate, plus proteases as inactive zymogens such as trypsinogen. The proteases stay inactive until they reach the duodenum, where enteropeptidase activates trypsin. This protects the pancreas from digesting itself, and premature activation contributes to pancreatitis.",
          "phd": "Glucose-stimulated insulin secretion follows the ‘triggering pathway’. Glucose enters through GLUT transporters (mainly GLUT1 in human β-cells, GLUT2 in rodents), and glucokinase acts as the glucose sensor. Rising ATP/ADP closes K_ATP channels, which depolarises the cell and lets Ca²⁺ in through voltage-gated channels. Sulfonylureas close K_ATP directly. Activating mutations in the K_ATP subunits (KCNJ11, ABCC8) cause neonatal diabetes that can be treated with sulfonylureas instead of insulin (Pearson et al. 2006)."
        },
        "meal": {
          "ms": "After you eat, sugar from your food enters your blood. Within minutes the pancreas notices and releases insulin. Insulin works like a key that lets sugar into your muscle, fat and liver cells. The pancreas also sends digestive juice into your intestine to break down your meal.",
          "hs": "Insulin release starts even before food is absorbed: the sight, smell and taste of food trigger a small early burst. Then, as blood glucose rises, beta cells release much more. Gut hormones called incretins boost insulin release even further. This is why swallowing glucose triggers more insulin than the same glucose injected into a vein.",
          "college": "Insulin secretion is biphasic: a fast first phase from readily releasable granules, then a sustained second phase. The incretins GLP-1 (from L-cells) and GIP (from K-cells) amplify glucose-stimulated insulin secretion through cAMP. They account for up to 70% of the insulin response after a meal, the incretin effect. Insulin drives GLUT4 translocation in muscle and fat, and glucose usually returns to baseline within 2–3 hours.",
          "phd": "The incretin effect is measured by comparing oral glucose with isoglycaemic intravenous glucose. It is markedly reduced in type 2 diabetes, mostly because β-cells respond poorly to GIP while still responding to GLP-1. That insight led to GLP-1 receptor agonists and DPP-4 inhibitors. Continuous glucose monitoring has shown large differences between individuals in their responses to identical meals. These responses are partly predictable from microbiome features (Zeevi et al. 2015)."
        },
        "exercise": {
          "ms": "When you exercise, your pancreas lowers its insulin output and releases more glucagon. That might sound backwards, but it helps. Muscles can soak up sugar during exercise without much insulin, and the glucagon makes sure the liver keeps the blood supplied with sugar.",
          "hs": "During exercise, adrenaline and the sympathetic nervous system tell the pancreas to release less insulin and more glucagon. Working muscles can take up glucose without insulin, because contraction itself moves glucose transporters to the cell surface. This is why people with type 1 diabetes often need less insulin, or extra snacks, when they exercise.",
          "college": "Exercise suppresses insulin secretion through α2-adrenergic receptors on β-cells, while sympathetic and β-adrenergic input raise glucagon. Contraction stimulates GLUT4 translocation independently of insulin signalling, through pathways involving AMPK, Ca²⁺/calmodulin and Rac1. Insulin sensitivity in the trained muscle stays raised for 24–48 hours after exercise, which helps refill glycogen.",
          "phd": "Contraction-stimulated glucose uptake bypasses proximal insulin signalling, so it is preserved in insulin-resistant muscle. This underpins exercise as a therapy for type 2 diabetes. The insulin sensitisation after exercise is local to the exercised muscle and involves AMPK-dependent phosphorylation of TBC1D4 (AS160). In type 1 diabetes, circulating insulin cannot be lowered during exercise, and this is a key cause of exercise-associated hypoglycaemia."
        }
      }
    },
    "kidneys": {
      "name": "Kidneys",
      "blurb": "Filters that fine-tune water, salt and waste",
      "related": ["heart", "liver", "brain"],
      "phases": {
        "sleep": {
          "ms": "At night your kidneys make less urine, so you usually don’t need to get up to pee. A hormone tells your kidneys to save water while you sleep. The urine they do make is darker and more concentrated, which is why your first pee in the morning is often a deeper yellow.",
          "hs": "At night the brain releases more antidiuretic hormone (ADH, also called vasopressin). ADH makes the kidneys put more water back into the blood, so urine becomes concentrated. Kidney blood flow and filtration also follow a daily rhythm and are lower at night. Children who wet the bed sometimes don’t yet make enough ADH at night.",
          "college": "ADH from the posterior pituitary binds V2 receptors on the principal cells of the collecting duct. This inserts aquaporin-2 water channels into the apical membrane. Water then moves by osmosis into the hypertonic medullary interstitium, so urine can reach about 1200 mOsm/kg. GFR, urine flow and sodium excretion have circadian rhythms with a low point at night. Desmopressin, a synthetic ADH analogue, treats bedwetting and nocturia.",
          "phd": "Clock genes in the kidney regulate transporter expression, for example ENaC through Per1 (Gumz et al. 2009). This creates day–night differences in sodium handling, and disrupting it alters blood-pressure rhythms in mice. In older adults, nocturnal polyuria comes from loss of the night-time ADH rise, altered natriuresis, and fluid moving out of the legs when lying down. Nephrogenic diabetes insipidus is caused by mutations in AVPR2 or AQP2."
        },
        "rest": {
          "ms": "You have two bean-shaped kidneys near your back, each about the size of your fist. Together they filter all the liquid part of your blood about 60 times a day, removing waste and extra water. The waste leaves your body as urine. Your kidneys also help control your blood pressure and how many red blood cells you make.",
          "hs": "Each kidney has about a million tiny filtering units called nephrons. Each nephron starts with a glomerulus, a ball of capillaries that filters the blood. The filtered fluid then flows through a long tube that takes back useful things like glucose, salt and most of the water. What is left, about 1–2 litres a day, becomes urine.",
          "college": "The glomerular filtration rate (GFR) is about 125 mL/min, or 180 L/day, and over 99% of it is reabsorbed. The proximal tubule takes back about two-thirds of the filtered Na⁺ and water, plus essentially all the glucose through SGLT2 and SGLT1. The loop of Henle builds an osmotic gradient in the medulla by countercurrent multiplication. The kidneys also release renin to regulate blood pressure, and erythropoietin (EPO) when oxygen delivery falls.",
          "phd": "SGLT2 inhibitors such as empagliflozin were developed to lower glucose. They also reduce hospitalisation for heart failure and slow CKD progression, even in patients without diabetes (EMPA-KIDNEY, DAPA-CKD). A plausible mechanism is restored tubuloglomerular feedback and less glomerular hyperfiltration. Nephron number varies about tenfold between people, from roughly 200,000 to over 2 million per kidney. A low nephron endowment is linked to hypertension (the Brenner hypothesis)."
        },
        "meal": {
          "ms": "After a meal, especially a salty or protein-rich one, your kidneys get to work balancing things out. They filter away extra salt and the waste made when your body breaks down protein. If you drink a lot with your meal, they will soon make more urine to get rid of the extra water.",
          "hs": "When you eat protein, your body breaks down the extra amino acids, and the liver turns their nitrogen into urea. The kidneys filter urea out of the blood. A protein-rich meal increases kidney blood flow and filtration for a few hours. Salty food makes you thirsty, and the kidneys get rid of the extra sodium over the next day or so.",
          "college": "A protein load raises GFR by around 20–40%, which is called ‘renal functional reserve’. This is mediated partly by glucagon, by amino-acid-stimulated proximal reabsorption, and by reduced tubuloglomerular feedback. Urea is recycled in the inner medulla through UT-A1 transporters and contributes to the concentrating gradient. A gut–kidney signalling axis may help the kidneys anticipate the sodium in a meal.",
          "phd": "Hyperfiltration from chronically high protein intake has been proposed to speed decline in CKD, so protein restriction is considered in advanced disease; benefits in healthy people are unproven. Studies by Titze and colleagues challenged classical sodium balance. In long-term controlled-intake studies, sodium excretion showed infradian rhythms (Rakova et al. 2013). Osmotically inactive sodium can also be stored in skin and muscle."
        },
        "exercise": {
          "ms": "When you exercise, you lose a lot of water as sweat, so your kidneys save water. Less blood goes to your kidneys, and they make less urine. Drinking water after exercise helps your kidneys and the rest of your body get back to normal.",
          "hs": "During exercise blood is sent to the muscles, and blood flow to the kidneys can drop by half or more. Hormones such as ADH and aldosterone tell the kidneys to hold on to water and salt, which makes up for sweat losses. Very hard exercise in the heat can stress the kidneys, especially if you become dehydrated.",
          "college": "Renal blood flow falls with exercise intensity, by up to 50–75% at maximal effort, through sympathetic renal vasoconstriction. GFR falls proportionally less, because constriction of the efferent arterioles raises the filtration fraction. The renin–angiotensin–aldosterone system is activated, which increases Na⁺ reabsorption in the distal nephron. Rhabdomyolysis from extreme exertion can release myoglobin, which damages the tubules.",
          "phd": "Ultra-endurance events often produce transient rises in serum creatinine that meet the criteria for acute kidney injury. Whether this reflects true tubular injury or altered creatinine kinetics is debated, although biomarkers such as NGAL and KIM-1 suggest some subclinical injury. Exercise-associated hyponatraemia comes mainly from drinking more than is lost in sweat, combined with non-osmotic ADH secretion. Sodium loss alone does not cause it."
        }
      }
    },
    "muscles": {
      "name": "Muscles",
      "blurb": "Engines that move you and soak up sugar",
      "related": ["heart", "liver", "pancreas"],
      "phases": {
        "sleep": {
          "ms": "While you sleep, your muscles relax and repair. Tiny bits of damage from the day get fixed, and muscles grow a little stronger. During dream sleep most of your muscles go completely limp, so you don’t act out your dreams.",
          "hs": "Growth hormone is released in big pulses during deep sleep, and it helps muscles repair and build protein. During REM sleep, signals from the brainstem paralyse most skeletal muscles; only the diaphragm and the eye muscles keep moving. Muscle protein is always being built and broken down. Over the night breakdown slightly outweighs building, because you aren’t eating.",
          "college": "The largest growth-hormone pulse of the day usually follows sleep onset and is associated with slow-wave sleep. REM atonia is produced by glycinergic and GABAergic inhibition of motor neurons, driven from the sublaterodorsal nucleus through the medulla. When it fails, the result is REM sleep behaviour disorder. Overnight fasting leaves muscle in negative protein balance, and eating protein before sleep can partly reverse this.",
          "phd": "Res et al. (2012) showed that 40 g of casein taken before sleep was digested and absorbed overnight. After evening resistance exercise, it increased overnight muscle protein synthesis. REM sleep behaviour disorder is a strong prodromal marker of α-synucleinopathies. Most patients eventually develop Parkinson’s disease, dementia with Lewy bodies or multiple system atrophy. Clocks in skeletal muscle regulate glucose uptake and mitochondrial function across the day."
        },
        "rest": {
          "ms": "You have more than 600 muscles, and together they make up around a third of your body weight. Even when you sit still, some muscles are working to keep you upright and hold your head up. Muscles also make heat, which is why you shiver when you’re cold.",
          "hs": "Skeletal muscle is made of long cells called muscle fibres. Inside them, protein filaments called actin and myosin slide past each other to make the muscle shorter. ATP, the cell’s energy currency, powers this sliding. At rest, muscles burn mostly fat and store sugar as glycogen, ready for action.",
          "college": "Each sarcomere contains thick myosin filaments and thin actin filaments. In the sliding filament theory, myosin heads bind actin, perform a power stroke, and use ATP to detach. An action potential in the motor neuron releases acetylcholine at the neuromuscular junction, which triggers Ca²⁺ release from the sarcoplasmic reticulum. Ca²⁺ binds troponin, which moves tropomyosin off the binding sites on actin. A typical adult holds roughly 400–500 g of glycogen in muscle.",
          "phd": "Huxley & Niedergerke and Huxley & Hanson independently proposed the sliding filament mechanism in 1954. A.F. Huxley’s 1957 cross-bridge model is still foundational. At rest, skeletal muscle accounts for about 20% of energy expenditure, but after meals it becomes the main site of insulin-stimulated glucose disposal. Fibre types differ in their myosin heavy chain isoforms (I, IIa, IIx) and in mitochondrial density. Their plasticity is driven by PGC-1α and calcineurin signalling."
        },
        "meal": {
          "ms": "After you eat, your muscles act like a big storage cupboard for sugar. Insulin tells them to take sugar out of the blood and store it as glycogen, ready for your next run. Protein in your food gives muscles the building blocks they need to repair and grow.",
          "hs": "After a meal, muscles are the biggest user of glucose: they take up most of the sugar that insulin clears from the blood. Insulin moves glucose transporters called GLUT4 to the surface of the muscle cell. Amino acids from protein, especially leucine, switch on muscle building. This is why eating protein after exercise helps muscles recover.",
          "college": "In clamp studies, skeletal muscle accounts for about 70–80% of insulin-stimulated glucose uptake. Insulin acts through the insulin receptor, IRS-1, PI3K and Akt to trigger translocation of GLUT4 vesicles. Leucine activates mTORC1, the master switch for protein synthesis. In young adults, about 20–25 g of high-quality protein maximally stimulates muscle protein synthesis; older adults may need more.",
          "phd": "Insulin resistance in skeletal muscle is one of the earliest defects in type 2 diabetes. A leading mechanism is intramyocellular diacylglycerol and ceramides activating novel PKCs, which impair IRS-1 signalling (Samuel & Shulman). After a meal, muscle protein synthesis shows a ‘muscle full’ effect. Synthesis plateaus after about 90 minutes even though amino acids are still available (Atherton et al. 2010). Anabolic resistance blunts these responses with ageing."
        },
        "exercise": {
          "ms": "When you run, your muscles work hard. They burn sugar and fat to make energy, and they get warm. If you go really fast, you might feel a burning feeling as acids and other chemicals build up. Afterwards your muscles rebuild a bit stronger, so the next run feels easier.",
          "hs": "Muscles get their energy from ATP but only store a few seconds’ worth. They remake it in three ways. Creatine phosphate is instant. Breaking down glucose without oxygen is fast but limited. Aerobic respiration in mitochondria is slower but lasts a long time. During a steady run, most energy comes from burning glycogen and fat aerobically. Training adds more mitochondria and capillaries to your muscles.",
          "college": "ATP is regenerated by the phosphocreatine system, glycolysis and oxidative phosphorylation, and their shares shift with intensity and duration. As intensity rises, fuel use shifts from fat towards carbohydrate (the crossover concept). Lactate is not a waste product but a fuel and a gluconeogenic precursor. The burn of intense exercise comes mainly from H⁺, Pi and other metabolites stimulating group III/IV afferents. Endurance training increases mitochondrial density through PGC-1α.",
          "phd": "Brooks’ lactate shuttle theory recast lactate as a central metabolic intermediate. It is oxidised by the heart, oxidative muscle and the brain, and used for gluconeogenesis. Fatigue during high-intensity work has many causes. Pi accumulation reduces cross-bridge force and Ca²⁺ sensitivity, while acidosis inhibits less at physiological temperatures than was once thought. Exercise signalling through AMPK, CaMKII and p38 MAPK converges on PGC-1α to drive mitochondrial biogenesis."
        }
      }
    }
  }
}

/* Oxygen content: 1.34 mL O₂ per g of haemoglobin × ~14.5 g/dL ≈ 194 mL O₂ per L of blood when fully saturated */
const O2_CAP = 194;
function sampleKF(kf, h){
  h = wrapH(h);
  const n = kf.length;
  let i = n - 1;
  for (let k = 0; k < n; k++){ if (kf[k][0] > h){ i = k - 1; break; } }
  let a, b, ta, tb;
  if (i < 0){ a = kf[n - 1]; b = kf[0]; ta = a[0] - 24; tb = b[0]; }
  else if (i === n - 1){ a = kf[n - 1]; b = kf[0]; ta = a[0]; tb = b[0] + 24; }
  else { a = kf[i]; b = kf[i + 1]; ta = a[0]; tb = b[0]; }
  const t = tb > ta ? clamp((h - ta) / (tb - ta)) : 0;
  return lerp(a[1], b[1], smooth(t));
}
const Physio = {
  at(h){
    const out = {};
    for (const k in PHYSIO) out[k] = sampleKF(PHYSIO[k], h);
    out.phase = phaseAt(h);
    out.accent = PHASE_BY_ID[out.phase].color;
    /* after a meal (gut channel above its fasting level) cardiac output rises
       ~10–15%, mostly through a bigger stroke volume, to feed the gut */
    const pp = clamp((out.gut - .3) / .7) * (1 - out.muscle);
    out.strokeVol *= 1 + .1 * pp;
    out.heartRate += 3 * pp;
    /* derived heart–lung numbers */
    out.co = out.heartRate * out.strokeVol / 1000;              /* cardiac output, L/min */
    out.ve = out.breathRate * out.tidalVol / 1000;              /* minute ventilation, L/min */
    out.avDiff = out.vo2 / out.co;                              /* Fick: a–v O₂ difference, mL O₂ per L */
    out.svo2 = clamp(out.spo2 - 100 * out.avDiff / O2_CAP, 15, 99); /* mixed venous saturation, % */
    /* where the cardiac output goes, L/min. The brain autoregulates, so its
       flow is fixed and the rest of the output is shared out by relative
       demand: gut flow roughly doubles after meals (postprandial hyperaemia)
       and is cut by two-thirds in exercise; kidney flow falls in exercise;
       working legs take most of the rise; skin opens up to dump heat. */
    const brain = .75;
    const rel = { kidneys: 1.15 - .55 * out.muscle, gut: (1.1 + 1.5 * pp) * (1 - .65 * out.muscle),
                  arms: .45 + .9 * out.sweat, legs: .55 + 11.5 * Math.max(0, out.muscle - .12) };
    let sum = 0; for (const k in rel) sum += rel[k];
    out.flow = { brain };
    for (const k in rel) out.flow[k] = rel[k] * Math.max(0, out.co - brain) / sum;
    /* O₂ extraction per bed (fraction of arterial content removed) */
    out.extract = { brain: .34, kidneys: .08, gut: .2, arms: .3 - .12 * out.sweat, legs: .32 + .5 * out.muscle };
    return out;
  }
};

  const x2 = x + Math.cos(a) * len, y2 = y + Math.sin(a) * len;

/* =========================================================================
   RHYTHM — beat and breath phases shared by scene and vitals
   ========================================================================= */
/* Respiratory sinus arrhythmia: the vagus speeds the heart a little on each
   in-breath and slows it on the out-breath. Strong at rest and in sleep, it all
   but vanishes as vagal tone is withdrawn during exercise. A slow random walk
   adds the remaining beat-to-beat variability. hrNow is the instantaneous rate. */
/* Breathing is not a sine wave. Breathing in is active (diaphragm) and takes
   ~40% of the cycle at rest; breathing out is passive elastic recoil, fast at
   first and then levelling into a pause. In hard exercise the out-breath is
   pushed by the abdominal muscles and the cycle nears 1:1. */
function breathShape(f, ti){ /* f = breath phase → {vol 0–1, psi} */
  f = ((f % 1) + 1) % 1;
  if (f < ti){ const x = f / ti; return { vol: (1 - Math.cos(Math.PI * x)) / 2, psi: x / 2 }; }
  const x = (f - ti) / (1 - ti), k = 4.5;
  return { vol: (Math.exp(-k * x) - Math.exp(-k)) / (1 - Math.exp(-k)), psi: .5 + x / 2 };
}
const Rhythm = {
  beat: 0, breath: 0, hrNow: 60, jit: 0, jitT: 0, lung: 0, insp: 0, ti: .4,
  /* lung = volume 0–1; insp > 0 while air flows in (drives the thoracic pump) */
  tick(dt, ph){
    this.ti = .4 + .09 * clamp((ph.breathRate - 14) / 22);
    this.breath += dt * ph.breathRate / 60;
    const b = breathShape(this.breath, this.ti);
    this.lung = b.vol; this.insp = Math.sin(2 * Math.PI * b.psi);
    this.jitT += (Math.random() - .5) * .012 - this.jitT * dt * .5;
    this.jitT = clamp(this.jitT, -.015, .015);
    this.jit += (this.jitT - this.jit) * clamp(dt * 1.5);
    const rsa = .07 * clamp(1 - (ph.heartRate - 55) / 70) + .005;
    /* in-breath → vagal brake eases → faster, peaking as it ends; out-breath → slower */
    this.hrNow = ph.heartRate * (1 - rsa * Math.cos(2 * Math.PI * b.psi) + this.jit);
    this.beat += dt * this.hrNow / 60;

/* Ventricular volume through one beat, 0 = end-systolic, 1 = end-diastolic,
   in real time and locked to the ECG (R peak at t = 0): isovolumic contraction,
   ejection (fast then slow) ending with the T wave, isovolumic relaxation,
   rapid passive filling, slow filling, then the atrial kick after the P wave.
   As the rate rises, it is the filling time that gets squeezed. */
function ventVolume(beat, bpm){
  const RR = 60 / Math.max(30, bpm), PR = Math.min(.2, Math.max(.12, .16 - .0005 * (bpm - 70)));
  let u = (((beat % 1) + 1) % 1) * RR - (PR + .03); /* seconds since R */
  if (u < 0) u += RR;
  const ej0 = .045, ej1 = .3 * Math.sqrt(RR) + .02, fill0 = ej1 + .06;
  const kick0 = RR - PR + .07, kickW = Math.max(.05, PR - .08);
  if (u < ej0) return 1;
  if (u < ej1){ const x = (u - ej0) / (ej1 - ej0); return (1 - x) * (1 - x); }
  if (u < fill0) return 0;
  const passive = .78 * (1 - Math.exp(-(u - fill0) / .07)) + .06 * clamp((u - fill0 - .2) / .4);
  if (u < kick0) return passive;
  const atK = clamp((u - kick0) / kickW);
  return passive + (1 - passive) * atK * atK * (3 - 2 * atK);

    if (v > hi){ hi = v; ih = k; }

      <ellipse id="s-cheekL" cx="566" cy="204" rx="10" ry="6" fill="#e2707a"/><ellipse id="s-cheekR" cx="634" cy="204" rx="10" ry="6" fill="#e2707a"/>
      <g id="s-eyesOpen" fill="var(--ink)"><ellipse cx="578" cy="188" rx="5.5" ry="6.5"/><ellipse cx="622" cy="188" rx="5.5" ry="6.5"/></g>
      <g id="s-eyesShut" class="face"><path d="M571 189 Q578 194 585 189"/><path d="M615 189 Q622 194 629 189"/></g>
      <path id="s-mouth" class="face" d="M588 210 Q600 218 612 210"/>
      <ellipse id="s-mouthO" cx="600" cy="212" rx="7" ry="5.5" fill="var(--ink)"/>

    svg.innerHTML = s;
    ["sky", "stars", "sun", "moon", "moonShade", "hills", "quadL", "quadR", "lungs", "heart", "gutGlow", "cheekL", "cheekR", "eyesOpen", "eyesShut", "mouth", "mouthO", "ring", "blood", "fx", "eso"]
      .forEach(k => r[k] = svg.querySelector("#s-" + k));
  }

  let lastH = -1;
  function update(h){
    if (Math.abs(h - lastH) < .003) return;
    lastH = h;
    const ph = Physio.at(h); cur = ph;
    const root = document.documentElement;
    root.style.setProperty("--accent", ph.accent);
    root.dataset.phase = ph.phase;

    /* sky */
    const hh = wrapH(h), dl = ph.daylight;
    let sky = mix("#1b2142", "#a9d3ef", dl);
    const dusk = Math.max(0, 1 - Math.abs(hh - 6.6) / .9) + Math.max(0, 1 - Math.abs(hh - 20) / .9);
    sky = mix(sky, "#f2a46a", clamp(dusk) * .6);
    r.sky.setAttribute("fill", sky);
    r.moonShade.setAttribute("fill", sky);
    r.hills.setAttribute("fill", mix("#1a2526", "#86b07a", dl));
    r.stars.setAttribute("opacity", f1(1 - dl));
    const arc = t => [890 + 140 * t, 312 - 130 * Math.sin(Math.PI * t)];
    const tD = (hh - 6.2) / (20.4 - 6.2);
    if (tD > 0 && tD < 1){ const [x, y] = arc(tD); r.sun.setAttribute("cx", f1(x)); r.sun.setAttribute("cy", f1(y)); r.sun.setAttribute("opacity", 1); }
    else r.sun.setAttribute("opacity", 0);
    const tN = wrapH(hh - 20.2) / 10.2;
    if (tN < 1){ const [x, y] = arc(tN); r.moon.setAttribute("transform", `translate(${f1(x)} ${f1(y)})`); r.moon.setAttribute("opacity", 1); }
    else r.moon.setAttribute("opacity", 0);

    /* body */
    const awake = ph.awake > .5, working = ph.muscle > .5;
    r.eyesOpen.style.display = awake ? "" : "none";
    r.eyesShut.style.display = awake ? "none" : "";
    r.mouth.style.display = working ? "none" : "";
    r.mouthO.style.display = working ? "" : "none";
    const qc = mix("#c98a7c", "#e0473c", ph.muscle);
    [r.quadL, r.quadR].forEach(q => { q.setAttribute("fill", qc); q.setAttribute("opacity", f1(.35 + .5 * ph.muscle)); });
    const flush = clamp(ph.muscle * .8 + (ph.coreTemp - 36.8) * .4);
    r.cheekL.setAttribute("opacity", f1(flush * .7)); r.cheekR.setAttribute("opacity", f1(flush * .7));
    r.gutGlow.setAttribute("opacity", f1(ph.gut * .9));
    if (reducedMotion){ r.heart.removeAttribute("transform"); r.lungs.removeAttribute("transform"); }
    Particles.setRates(ph);
  }

  function animate(){
    if (reducedMotion || !cur) return;
    const s = beatScale(Rhythm.beat, Rhythm.hrNow);
    r.heart.setAttribute("transform", `scale(${s.toFixed(3)})`);
    /* lung size follows the breath waveform; amplitude follows tidal volume */
    const v = Rhythm.lung;
    const depth = .022 + .058 * clamp((cur.tidalVol - 420) / 1500);
    r.lungs.setAttribute("transform", `translate(600 300) scale(${(1 + depth * .6 * v).toFixed(3)} ${(1 + depth * v).toFixed(3)}) translate(-600 -300)`);
  }

  function focus(id){
    const p = id && focusPoints[id];
    if (p){
      r.ring.setAttribute("cx", f1(p.x)); r.ring.setAttribute("cy", f1(p.y));
      r.ring.setAttribute("r", (Topics.get(id) && Topics.get(id).ring) || 40);
    }
    r.ring.classList.toggle("on", !!p);
  }
  return { build, update, animate, focus, svg, focusPoints, refs: r, get bbox(){ return CONFIG.bbox; } };
})();

/* =========================================================================
   PARTICLES — blood, food, breath, sweat, Zzz (respects reduced motion)
   ========================================================================= */
const Particles = (() => {
  const list = []; let ph = null, accF = 0, accZ = 0, accS = 0, wasIn = false;
  let esoL = 0;
  /* ---- blood: red cells that each do the full figure-of-eight ---- */
  const NCELL = 96, routes = [], cells = [];
  const SYS = [], PUL = [];
  const RED = hex2rgb("#d63340"), BLUE = hex2rgb("#5a68bd");
  const satCol = sat => { const t = clamp((sat - 40) / 56); return rgb2hex(BLUE.map((v, i) => lerp(v, RED[i], t * t * (3 - 2 * t)))); };
  function init(){
    const R = Scene.refs, svg = Scene.svg;
    esoL = R.eso.getTotalLength();
    CIRC.forEach((c, i) => {
      const a = svg.querySelector("#s-va" + i), v = svg.querySelector("#s-vv" + i);
      const La = a.getTotalLength(), Lv = v.getTotalLength();
      const pa = a.getPointAtLength(La), pv = v.getPointAtLength(0);
      const Lc = Math.max(8, Math.hypot(pv.x - pa.x, pv.y - pa.y));
      routes.push({ ...c, A: a, V: v, La, Lc, Lv, pa, pv, L: La + Lc + Lv });
      (c.sys ? SYS : PUL).push(i);
    });
    const rng = mulberry32(11);
    for (let i = 0; i < NCELL; i++){
      const ri = rng() < .3 ? PUL[i % 2] : SYS[Math.floor(rng() * SYS.length)];
      cells.push({ c: el("circle", { r: 2.8, class: "rbc" }, R.blood), ri, s: rng() * routes[ri].L, satIn: 70, col: "" });
    }
  }
  /* pick the next organ in proportion to its share of the cardiac output */
  function pickSys(){
    const f = ph.flow, w = SYS.map(i => f[routes[i].bed] / (routes[i].bed === "brain" || routes[i].bed === "gut" ? 1 : 2));
    let u = Math.random() * w.reduce((a, b) => a + b, 0);
    for (let k = 0; k < w.length; k++){ u -= w[k]; if (u <= 0) return SYS[k]; }
    return SYS[0];
  }
  function venSat(bed){ return ph.spo2 * (1 - ph.extract[bed]); }
  function place(k){
    const r = routes[k.ri], s = k.s;
    let x, y, sat;
    const sa = ph ? ph.spo2 : 97, sv = r.sys ? (ph ? venSat(r.bed) : 70) : sa;
    if (s < r.La){ const p = r.A.getPointAtLength(s); x = p.x; y = p.y; sat = r.sys ? sa : k.satIn; }
    else if (s < r.La + r.Lc){ const t = (s - r.La) / r.Lc; x = lerp(r.pa.x, r.pv.x, t); y = lerp(r.pa.y, r.pv.y, t); sat = lerp(r.sys ? sa : k.satIn, sv, smooth(t)); }
    else { const p = r.V.getPointAtLength(s - r.La - r.Lc); x = p.x; y = p.y; sat = sv; }
    k.c.setAttribute("cx", f1(x)); k.c.setAttribute("cy", f1(y));
    const col = satCol(sat);
    if (col !== k.col){ k.col = col; k.c.setAttribute("fill", col); }
  }
  function moveBlood(dt){
    /* mean speed scales with cardiac output; arterial flow surges in systole
       (ejection follows the R wave), venous return speeds up on each in-breath
       (the thoracic pump), and cells crawl through the capillaries */
    const base = 62 * Math.pow(ph.co / 4.9, .75);
    const RR = 60 / Rhythm.hrNow;
    let u = ((Rhythm.beat % 1) + 1) % 1 * RR - .19; if (u < 0) u += RR;
    const ej = .3 * Math.sqrt(RR);
    const surge = u < ej ? 1 + 1.6 * Math.sin(Math.PI * u / ej) : 1;
    const art = surge / (1 + 1.6 * (2 / Math.PI) * ej / RR);
    const ven = 1 + .3 * Rhythm.insp;
    for (const k of cells){
      const r = routes[k.ri];
      const v = k.s < r.La ? art : k.s < r.La + r.Lc ? .3 : ven;
      k.s += dt * base * v;
      if (k.s >= r.L){
        k.s -= r.L;
        if (r.sys){ k.satIn = venSat(r.bed); k.ri = PUL[Math.random() < .5 ? 0 : 1]; }
        else k.ri = pickSys();
        k.s = Math.min(k.s, routes[k.ri].L - 1);
      }
      place(k);
    }
  }
  function setRates(p){ ph = p; if (reducedMotion) cells.forEach(place); }
  function add(kind, e, extra = {}){ list.push({ kind, e, age: 0, life: 1, ...extra }); }
  function tick(dt){
    if (reducedMotion || !ph) return;
    const g = Scene.refs.fx;
    moveBlood(dt);
    if (ph.eating > .5){ accF += dt / .9; while (accF >= 1){ accF--; add("food", el("ellipse", { rx: 6, ry: 4.5, fill: "#b98a5a" }, g), { life: 1.9 }); } } else accF = 0;
    if (ph.awake < .5){ accZ += dt / 1.3; while (accZ >= 1){ accZ--; const t = el("text", { class: "zz", x: 660, y: 104 }, g); t.textContent = "z"; add("z", t, { life: 2.4 }); } } else accZ = 0;
    if (ph.sweat > .15){ accS += dt * ph.sweat * 2.4; while (accS >= 1){ accS--; add("sweat", el("path", { d: "M0 -5 C2 -1 3.5 2 0 4 C-3.5 2 -2 -1 0 -5Z", fill: "#7fc3e8" }, g), { life: .9, x: 556 + Math.random() * 88, y: 112 + Math.random() * 20 }); } }
    /* a puff of breath as each out-breath starts, bigger with deeper breaths */
    const inNow = Rhythm.insp > 0;
    if (wasIn && !inNow && ph.awake > .5 && list.length < 80) add("puff", el("circle", { cx: 600, cy: 214, r: 3, class: "puff" }, g), { life: .9, size: .7 + .6 * clamp((ph.tidalVol - 450) / 1400) });
    wasIn = inNow;

    const eso = Scene.refs.eso;
    for (let i = list.length - 1; i >= 0; i--){
      const p = list[i]; p.age += dt; const t = p.age / p.life;
      if (t >= 1){ p.e.remove(); list.splice(i, 1); continue; }
      if (p.kind === "food"){
        if (t < .8){ const q = eso.getPointAtLength(t / .8 * esoL); p.e.setAttribute("cx", f1(q.x)); p.e.setAttribute("cy", f1(q.y)); }
        else { const u = (t - .8) / .2; p.e.setAttribute("cx", f1(lerp(630, 652, u))); p.e.setAttribute("cy", f1(lerp(444, 482, u))); p.e.setAttribute("opacity", f1(1 - u)); }
      } else if (p.kind === "z"){
        p.e.setAttribute("x", f1(660 + p.age * 16)); p.e.setAttribute("y", f1(104 - p.age * 24));
        p.e.setAttribute("font-size", f1(16 + p.age * 8)); p.e.setAttribute("opacity", f1(1 - t));
      } else if (p.kind === "sweat"){
        p.y += 48 * dt; p.e.setAttribute("transform", `translate(${f1(p.x)} ${f1(p.y)})`); p.e.setAttribute("opacity", f1(1 - t));
      } else {
        p.e.setAttribute("r", f1((3 + t * 16) * p.size)); p.e.setAttribute("opacity", f1(.5 * (1 - t)));
      }
    }
  }
  return { init, setRates, tick };
})();

/* =========================================================================
   CAMERA — animated viewBox
   ========================================================================= */
const Camera = (() => {
  const svg = $("#scene");
  let cur = null, from = null, to = null, t0 = 0, dur = 950, moving = false;
  function homeView(){
    const b = Scene.bbox, wrap = $("#sceneWrap");
    const asp = wrap.clientHeight / Math.max(1, wrap.clientWidth);
    let w = b.x1 - b.x0, h = b.y1 - b.y0;
    let top = b.y0 - h * .14;   /* headroom for the clock heading */
    const need = b.y1 - top;
    h = need;
    if (h / w < asp) h = w * asp; else w = h / asp;
    top -= (h - need) / 2;      /* centre any spare height (tall screens) */
    const cx = (b.x0 + b.x1) / 2;
    return { x: cx - w / 2, y: top, w, h };
  }
  function focusView(p, wWorld){
    const wrap = $("#sceneWrap");
    const asp = wrap.clientHeight / Math.max(1, wrap.clientWidth);
    const w = wWorld, h = w * asp;
    return { x: p.x - w / 2, y: p.y - h / 2, w, h };
  }
  function apply(v){ svg.setAttribute("viewBox", `${f1(v.x)} ${f1(v.y)} ${f1(v.w)} ${f1(v.h)}`); cur = v; }
  function go(v, instant){
    if (instant || reducedMotion || !cur){ apply(v); moving = false; Hotspots.place(); return; }
    from = { ...cur }; to = v; t0 = performance.now(); moving = true;
  }
  function tick(nowT){
    if (!moving) return false;
    const t = clamp((nowT - t0) / dur), e = t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    const w = Math.exp(lerp(Math.log(from.w), Math.log(to.w), e));
    const cx = lerp(from.x + from.w / 2, to.x + to.w / 2, e), cy = lerp(from.y + from.h / 2, to.y + to.h / 2, e);
    const h = w * (to.h / to.w);
    apply({ x: cx - w / 2, y: cy - h / 2, w, h });
    if (t >= 1){ moving = false; apply(to); }
    return true;
  }
  return { go, tick, homeView, focusView };
})();

/* ---------- illustration helpers ---------- */
let UID = 0;
function makeCtx(s){
  const ph = Physio.at(s.hour);
  return {
    hour: s.hour, phase: ph.phase, ph, li: LEVEL_INDEX[s.level], labels: [], marks: "", rng: mulberry32(31),
    mark(x, y, text, min = 0){
      if (this.li < min) return;
      const t = Array.isArray(text) ? text[Math.min(this.li, text.length - 1)] : text;
      if (!t) return;
      this.labels.push(t);
      this.marks += `<g class="mk" data-i="${this.labels.length}" tabindex="0" role="button" aria-label="${this.labels.length}: ${esc(t)}"><circle cx="${f1(x)}" cy="${f1(y)}" r="7.5"/><text x="${f1(x)}" y="${f1(y + 3.3)}">${this.labels.length}</text></g>`;
    }
  };
}
/* ---------- simulation helpers ----------
   A topic's simulate(k, ctx) runs once the illustration is in the DOM and
   returns tick(dt, ph, R) (R = Rhythm). It adds moving parts in <g class="sim">
   layers and moves them by setting attributes. It never rebuilds markup per frame.
   Moving parts keep their state in k.mem, which survives the panel's
   half-hourly re-renders of the same organ and phase, so nothing jumps.
   Markup can opt in to generic motion as well:
     class="sim-dash" data-v="px/s"  dashes flow along the path (negative = backwards)
     class="sim-glow" data-f="Hz"    opacity pulses gently */
const PATHS = new Map();
function sampler(svg, d, n = 96){
  let s = PATHS.get(d);
  if (s) return s;
  const p = el("path", { d }, svg), L = p.getTotalLength();
  const xs = new Float32Array(n + 1), ys = new Float32Array(n + 1);
  for (let i = 0; i <= n; i++){ const q = p.getPointAtLength(L * i / n); xs[i] = q.x; ys[i] = q.y; }
  p.remove();
  const seg = t => { const f = clamp(t) * n, i = Math.min(n - 1, Math.floor(f)); return [i, f - i]; };
  s = {
    L,
    at(t){ const [i, u] = seg(t); return [lerp(xs[i], xs[i + 1], u), lerp(ys[i], ys[i + 1], u)]; },
    angle(t){ const [i] = seg(t); return Math.atan2(ys[i + 1] - ys[i], xs[i + 1] - xs[i]); }
  };
  PATHS.set(d, s);
  return s;
}
const ease = { lin: u => u, out: u => 1 - (1 - u) * (1 - u), io: u => u * u * (3 - 2 * u) };
function simKit(svg, mem){
  const before = svg.querySelector(".mk");
  const dashes = [...svg.querySelectorAll(".sim-dash")], glows = [...svg.querySelectorAll(".sim-glow")];
  const glowBase = glows.map(g => +(g.getAttribute("opacity") || 1));
  const k = {
    svg, mem, t: mem.t || 0, warm: false,
    q: sel => svg.querySelector(sel),
    qa: sel => [...svg.querySelectorAll(sel)],
    sampler: d => sampler(svg, d),
    /* a layer above the picture and below the markers; clip = inside the magnifier */
    layer(clip){
      const g = el("g", { class: "sim" });
      if (clip){
        const id = "clip" + (++UID), cp = el("clipPath", { id });
        el("circle", { cx: MX, cy: MY, r: MR - .8 }, cp);
        svg.insertBefore(cp, before);
        g.setAttribute("clip-path", `url(#${id})`);
      }
      svg.insertBefore(g, before);
      return g;
    },
    /* short-lived particles that travel A → B and fade in and out.
       Particle: {x0, y0, x1, y1, life, age (< 0 = delayed), e: ease name, fill, wob} */
    spray(key, parent, n, make){
      const st = mem[key] || (mem[key] = { ps: [], acc: 0 });
      const nodes = Array.from({ length: n }, () => { const e = make(); e.setAttribute("opacity", 0); parent.appendChild(e); return e; });
      const fills = new Array(n).fill(null);
      return {
        add(p){ if (st.ps.length < n) st.ps.push({ age: 0, e: "io", ...p }); },
        emit(rate, dt, spawn){
          st.acc = Math.min(st.acc + rate * dt, 3);
          while (st.acc >= 1){ st.acc--; if (st.ps.length < n) this.add(spawn()); }
        },
        tick(dt){
          st.ps = st.ps.filter(p => (p.age += dt) < p.life);
          nodes.forEach((node, i) => {
            const p = st.ps[i];
            if (!p || p.age < 0){ node.setAttribute("opacity", 0); return; }
            const u = p.age / p.life, w = ease[p.e](u), wob = p.wob ? p.wob * Math.sin(u * 9 + i) : 0;
            node.setAttribute("transform", `translate(${f1(lerp(p.x0, p.x1, w) + wob)} ${f1(lerp(p.y0, p.y1, w))})`);
            node.setAttribute("opacity", f1(Math.min(1, u / .15, (1 - u) / .25)));
            if (p.fill && fills[i] !== p.fill){ fills[i] = p.fill; node.setAttribute("fill", p.fill); }
          });
        }
      };
    },
    /* a steady stream of n items moving along a path at a speed in px/s.
       opts: {jit (px across the path), rotate, colorAt(t), count (visible items)} */
    stream(key, parent, d, n, make){
      const S = sampler(svg, d);
      const st = mem[key] || (mem[key] = { s: 0, off: Array.from({ length: n }, (_, i) => [(i + Math.random() * .6) / n, Math.random() - .5]), op: new Array(n).fill(1) });
      const nodes = Array.from({ length: n }, () => parent.appendChild(make()));
      return {
        tick(dt, speed, o = {}){
          st.s = (st.s + speed * dt / S.L) % 1;
          const count = o.count === undefined ? n : o.count;
          nodes.forEach((node, i) => {
            const t = (st.off[i][0] + st.s) % 1, a = S.angle(t);
            let [x, y] = S.at(t);
            if (o.jit){ x -= Math.sin(a) * o.jit * st.off[i][1]; y += Math.cos(a) * o.jit * st.off[i][1]; }
            st.op[i] += ((i < count ? 1 : 0) - st.op[i]) * clamp(dt * 2.5);
            node.setAttribute("transform", `translate(${f1(x)} ${f1(y)})` + (o.rotate ? ` rotate(${f1(a * 180 / Math.PI)})` : ""));
            node.setAttribute("opacity", f1(st.op[i] * Math.min(1, t / .05, (1 - t) / .05)));
            if (o.colorAt) node.setAttribute("fill", o.colorAt(t));
          });
        }
      };
    },
    /* generic motion for .sim-dash and .sim-glow */
    auto(dt){
      mem.dash = (mem.dash || 0) + dt;
      dashes.forEach(p => p.setAttribute("stroke-dashoffset", f1(-mem.dash * p.dataset.v % 1000)));
      glows.forEach((g, i) => g.setAttribute("opacity", (glowBase[i] * (.62 + .38 * Math.sin(2 * Math.PI * k.t * (+g.dataset.f || .3)))).toFixed(2)));
    }
  };
  return k;
}
/* start a topic's simulation. Returns run(dt, ph) or null. A new state is
   pre-warmed for a few seconds so it opens already in motion. */
function startSim(topic, svg, ctx, mem){
  if (!topic.simulate) return null;
  const fresh = mem.t === undefined;
  const k = simKit(svg, mem), tick = topic.simulate(k, ctx);
  if (!tick) return null;
  const run = (dt, ph) => { mem.t = (mem.t || 0) + dt; k.t = mem.t; k.auto(dt); tick(dt, ph, Rhythm); };
  if (fresh || reducedMotion){ k.warm = true; for (let i = 0; i < 90; i++) run(1 / 30, ctx.ph); k.warm = false; }
  else run(0, ctx.ph);
  return run;
}

});

      const nut = k.spray("nut", L, 30, () => el("circle", { r: 2 }));
      const nRate = pick(p, { rest: 5, sleep: 1.2, exercise: 1.6 });
      let bugs = null;
      if (p === "sleep"){
        const m = k.mem;
        m.bugs = m.bugs || Array.from({ length: 9 }, () => ({ x: 178 + R() * 170, y: 22 + R() * 30, a: R() * 180, w: R() * 6 }));
        bugs = m.bugs.map(() => el("rect", { x: -5.5, y: -2.5, width: 11, height: 5, rx: 2.5, fill: "#6fa86a" }, L));
      }
      micro = (dt, ph) => {
        const v = 9 * ph.flow.gut;
        loops.forEach(l => l.tick(dt, v)); lac.forEach(l => l.tick(dt, 5));
        nut.emit(nRate, dt, () => { const [cx, top] = vil[Math.floor(R() * 6)]; return { x0: cx + (R() - .5) * 40, y0: 20 + R() * 20, x1: cx + (R() - .5) * 8, y1: top + 2, life: 2.4, fill: R() < .5 ? "#e2a93b" : "#7fa35a", wob: 2 }; });

    }
    return (dt, ph) => {
      const u = k.t % period / period, [x, y] = RING.at(u), a = RING.angle(u) + Math.PI / 2, h = 15;
      ring.setAttribute("d", `M${f1(x - Math.cos(a) * h)} ${f1(y - Math.sin(a) * h)} L${f1(x + Math.cos(a) * h)} ${f1(y + Math.sin(a) * h)}`);

      chyme.forEach((c, i) => c.setAttribute("transform", `translate(${f1(2.2 * Math.sin(k.t * 1.6 + i * 1.3) - 3 * power * Math.sin(Math.PI * u))} ${f1(1.6 * Math.cos(k.t * 1.9 + i))})`));

});

    const aff = k.stream("aff", L, "M166 44 C180 56 194 66 202 72", 4, cell);
    const eff = k.stream("eff", L, "M202 92 C192 102 184 112 176 122", 3, cell);
    const filt = k.stream("filt", L, TUB, 18, () => el("circle", { r: 1.5, fill: "#d9a63c" }));
    const duct = k.stream("duct", L, "M330 4 L330 218", 8, () => el("circle", { r: 2, fill: mix(urine, "#7a5410", .35) }));
    /* water pulled back out of the collecting duct: more when ADH is high (sleep, sweating) */
    const nW = pick(p, { sleep: 5, exercise: 5, rest: 2, meal: 3 });
    const water = k.spray("w", L, 24, () => el("path", { d: "M0 -3 c2 3 3 5 0 7 c-3 -2 -2 -4 0 -7Z", fill: "#5aa9e0" }));
    const uV = pick(p, { sleep: 6, exercise: 6, rest: 16, meal: 18 });
    return (dt, ph) => {
      const q = 10 * ph.flow.kidneys;
      aff.tick(dt, q, { rotate: true }); eff.tick(dt, q * .8, { rotate: true });
      filt.tick(dt, p === "exercise" ? 14 : 18); duct.tick(dt, uV);
      water.emit(nW * .9, dt, () => { const y = 112 + R() * Math.max(1, nW - 1) * 18; return { x0: 326, y0: y, x1: 296 - R() * 8, y1: y + 6, life: 1.3 }; });
      water.tick(dt);
    };
  }
});
