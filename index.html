/* =========================================================================
   GLOSSARY — auto-link terms, one tooltip
   ========================================================================= */
const Glossary = (() => {
  const index = [];
  for (const term in GLOSSARY) GLOSSARY[term].match.forEach(m => index.push([m, term]));
  index.sort((a, b) => b[0].length - a[0].length);
  const lookup = new Map(index.map(([m, t]) => [m.toLowerCase(), t]));
  const re = new RegExp(`(?<![\\w-])(${index.map(([m]) => m.replace(/[.*+?^${}()|[\]\\-]/g, "\\$&")).join("|")})(?![\\w-])`, "gi");
  const tip = $("#tip");
  function linkify(text){
    const used = new Set();
    return esc(text).replace(re, (w) => {
      const t = lookup.get(w.toLowerCase());
      if (!t || used.has(t)) return w;
      used.add(t);
      return `<button type="button" class="term" data-term="${esc(t)}">${w}</button>`;
    });
  }
  function show(btn){
    const t = btn.dataset.term, g = GLOSSARY[t]; if (!g) return;
    tip.innerHTML = `<b>${esc(t.charAt(0).toUpperCase() + t.slice(1))}</b>${esc(g.def)}`;
    tip.classList.add("on");
    const r = btn.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
    let x = r.left + r.width / 2 - tw / 2; x = clamp(x, 8, window.innerWidth - tw - 8);
    let y = r.bottom + 8; if (y + th > window.innerHeight - 8) y = r.top - th - 8;
    tip.style.left = x + "px"; tip.style.top = y + "px";
  }
  function hide(){ tip.classList.remove("on"); }
  document.addEventListener("mouseover", e => { const b = e.target.closest(".term"); if (b) show(b); });
  document.addEventListener("mouseout", e => { if (e.target.closest(".term")) hide(); });
  document.addEventListener("focusin", e => { const b = e.target.closest(".term"); if (b) show(b); });
  document.addEventListener("focusout", e => { if (e.target.closest(".term")) hide(); });
  document.addEventListener("click", e => { const b = e.target.closest(".term"); if (b) show(b); else hide(); });
  $("#panel").addEventListener("scroll", hide, { passive: true });
  return { linkify, hide };
})();

/* =========================================================================
   VITALS — live readout
   ========================================================================= */
const Vitals = (() => {
  const cv = $("#ecg"), c2 = cv.getContext("2d");
  const W = 56, H = 22, speed = 30;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = W * dpr; cv.height = H * dpr; c2.scale(dpr, dpr);
  const buf = Array.from({ length: W }, () => [0, 0]);
  let acc = 0, lastBeat = 0, ph = null;
  const txt = {};
  function setText(id, v){ if (txt[id] !== v){ txt[id] = v; $("#" + id).textContent = v; } }

  /* 24 h glucose mini-trace */
  const gsvg = $("#vGluSvg");
  const gy = g => 21 - (g - 70) / 80 * 19;
  let pts = "";
  for (let i = 0; i <= 96; i++) pts += `${i ? "L" : "M"}${i} ${f1(gy(sampleKF(PHYSIO.glucose, i / 4)))}`;
  gsvg.innerHTML = `<rect class="band" x="0" y="${f1(gy(100))}" width="96" height="${f1(gy(70) - gy(100))}"/><path class="tr" d="${pts}" vector-effect="non-scaling-stroke"/><circle class="now" id="vGluNow" r="2.6"/>`;
  const gNow = $("#vGluNow");

  function draw(){
    c2.clearRect(0, 0, W, H);
    c2.beginPath();
    const Y = v => H * .66 - v * H * .55;
    for (let x = 0; x < W; x++){ const [a, b] = buf[x]; x ? c2.lineTo(x + .25, Y(a)) : c2.moveTo(x + .25, Y(a)); c2.lineTo(x + .75, Y(b)); }
    c2.strokeStyle = "#d6404c"; c2.lineWidth = 1.3; c2.lineJoin = "round"; c2.stroke();
  }
  function staticFill(){ const hr = ph.heartRate, bAt = x => x / speed * hr / 60; for (let x = 0; x < W; x++) buf[x] = ecgSpan(bAt(x), bAt(x + 1), hr); draw(); }
  function update(p, h){
    ph = p;
    setText("vHr", String(Math.round(p.heartRate)));
    setText("vBr", String(Math.round(p.breathRate)));
    setText("vGlu", String(Math.round(p.glucose)));
    setText("vGluMm", (p.glucose / 18).toFixed(1) + " mmol/L");
    setText("vTemp", p.coreTemp.toFixed(1));
    setText("vBp", Math.round(p.sbp) + "/" + Math.round(p.dbp));
    setText("vSv", Math.round(p.strokeVol) + " mL/beat");
    setText("vVt", (p.tidalVol < 950 ? Math.round(p.tidalVol / 10) * 10 + " mL" : (p.tidalVol / 1000).toFixed(1) + " L") + "/breath");
    setText("vCo", p.co.toFixed(1));
    setText("vSat", Math.round(p.spo2) + " → " + Math.round(p.svo2));
    gNow.setAttribute("cx", f1(wrapH(h) * 4)); gNow.setAttribute("cy", f1(gy(p.glucose)));
    $("#vTempMk").style.left = (clamp((p.coreTemp - 36) / 2.5) * 100).toFixed(1) + "%";
    $("#hCort").style.width = (p.cortisol * 100).toFixed(0) + "%";
    $("#hMel").style.width = (p.melatonin * 100).toFixed(0) + "%";
    $("#hIns").style.width = (p.insulin * 100).toFixed(0) + "%";
    $("#hGcg").style.width = (p.glucagon * 100).toFixed(0) + "%";
    if (reducedMotion) staticFill();
  }
  function tick(dt){
    if (reducedMotion || !ph) return;
    acc += dt * speed;
    const n = Math.floor(acc);
    if (n > 0){
      acc -= n;
      const b = Rhythm.beat;
      const bAt = k => lastBeat + (b - lastBeat) * k / n;
      for (let k = Math.max(1, n - W + 1); k <= n; k++){ buf.shift(); buf.push(ecgSpan(bAt(k - 1), bAt(k), Rhythm.hrNow)); }
      lastBeat = b;
      draw();
    }
    const v = Rhythm.lung;
    $("#vBrDot").style.transform = `scale(${(.5 + .5 * v).toFixed(3)})`;
  }
  return { update, tick };
})();

    const svgBody = topic.illustrate(ctx) + ctx.marks;
    const text = textFor(id, phase, s.level);
    const tabs = PHASES.map(p => `<button type="button" data-phase="${p.id}" aria-pressed="${p.id === phase}">${p.label}</button>`).join("");
    const deeper = li < LEVELS.length - 1 ? `<button type="button" class="chip primary" data-level="${LEVELS[li + 1].id}">${esc(STRINGS.deeper(LEVELS[li + 1].label))}</button>` : "";
    const simpler = li > 0 ? `<button type="button" class="chip" data-level="${LEVELS[li - 1].id}">${esc(STRINGS.simpler(LEVELS[li - 1].label))}</button>` : "";
    const related = (data.related || []).filter(r => Topics.has(r)).map(r => `<button type="button" class="chip" data-topic="${r}">${esc(CONTENT.topics[r].name)}</button>`).join("");
    root.className = "panel-inner enter";
    root.innerHTML = `
      <div class="crumb">
        <button type="button" class="link" data-home>
          <svg width="12" height="12" viewBox="0 0 14 14" aria-hidden="true"><path d="M9 2 4 7l5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>${esc(STRINGS.wholeBody)}
        </button>
        <span class="when">${fmtTime(s.hour)} · ${PHASE_BY_ID[phase].label}</span>
      </div>
      <h2>${esc(data.name)}</h2>
      <p class="lede">${esc(data.blurb)}</p>
      <figure class="ill">
        <svg ${VB} role="img" aria-label="${esc(data.name)} during ${PHASE_BY_ID[phase].label.toLowerCase()}: ${esc(ctx.labels.join(", "))}">${svgBody}</svg>
        <div class="mk-tip" role="tooltip"></div>
      </figure>
      <div class="follow">
        <p class="follow-label">${esc(STRINGS.follow)}</p>
        <div class="tabs">${tabs}</div>
      </div>
      <div class="reading">
        <p class="reading-level">${pips(li)}${esc(LEVELS[li].label)}</p>
        <p class="text">${text ? Glossary.linkify(text) : esc(STRINGS.missing)}</p>
        <div class="depth">${deeper}${simpler}</div>
      </div>
      ${related ? `<div class="related"><p>${esc(STRINGS.seeAlso)}</p><div class="depth">${related}</div></div>` : ""}`;
    root.querySelector("[data-home]").addEventListener("click", () => store.set({ topic: null }));
    const fig = root.querySelector("figure.ill");
    const tip = fig.querySelector(".mk-tip"), marks = [...fig.querySelectorAll(".mk")];
    const showTip = mk => {
      marks.forEach(m => m.classList.toggle("on", m === mk));
      if (!mk){ tip.classList.remove("on"); return; }
      const fr = fig.getBoundingClientRect(), r = mk.getBoundingClientRect();
      const x = r.left + r.width / 2 - fr.left, y = r.top + r.height / 2 - fr.top;
      tip.textContent = ctx.labels[mk.dataset.i - 1];
      tip.classList.toggle("below", y < 60);
      tip.style.top = (y < 60 ? y + r.height / 2 : y - r.height / 2) + "px";
      tip.style.left = x + "px";
      const half = tip.offsetWidth / 2 + 4;
      tip.style.left = Math.min(Math.max(x, half), fr.width - half) + "px";
      tip.classList.add("on");
    };
    const restore = () => showTip(marks[pinnedMark - 1] || null);
    marks.forEach(mk => {
      const i = +mk.dataset.i;
      mk.addEventListener("mouseenter", () => showTip(mk));
      mk.addEventListener("mouseleave", restore);
      mk.addEventListener("focus", () => showTip(mk));
      mk.addEventListener("blur", restore);
      mk.addEventListener("click", e => { e.stopPropagation(); pinnedMark = pinnedMark === i ? 0 : i; restore(); });
      mk.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); mk.dispatchEvent(new MouseEvent("click")); } });
    });
    fig.addEventListener("click", () => { pinnedMark = 0; restore(); });
    if (pinnedMark > marks.length) pinnedMark = 0;
    const sk = id + "|" + phase;
    if (sk !== simKey){ simKey = sk; simMem = {}; }
    sim = startSim(topic, fig.querySelector("svg"), ctx, simMem);
    requestAnimationFrame(restore);
    root.querySelectorAll("[data-phase]").forEach(b => b.addEventListener("click", () => store.set({ hour: PHASE_BY_ID[b.dataset.phase].rep, playing: false })));
    root.querySelectorAll("[data-level]").forEach(b => b.addEventListener("click", () => store.set({ level: b.dataset.level })));
    root.querySelectorAll(".related [data-topic]").forEach(b => b.addEventListener("click", () => store.set({ topic: b.dataset.topic })));
  }

  function render(s, force){
    const key = `${s.topic}|${s.level}|${s.topic ? phaseAt(s.hour) + Math.floor(s.hour * 2) : ""}`;
    if (key === lastKey && !force) return;
    const animate = key.split("|")[0] !== lastKey.split("|")[0];
    lastKey = key;
    Glossary.hide();
    s.topic ? renderTopic(s) : renderIntro(s);
    if (!animate) root.classList.remove("enter");
    if (animate) $("#panel").scrollTop = 0;
  }
  function tick(dt, ph){ if (sim && !reducedMotion) sim(dt, ph); }
  return { render, tick };
})();

/* =========================================================================
   CONTROLS — level switch, timeline, play
   ========================================================================= */
const Controls = (() => {
  const seg = $("#levelSeg"), range = $("#hourRange"), hourBtns = $("#hourBtns"), dayBar = $("#dayBar"), play = $("#playBtn"), back = $("#backBtn");
  const icons = { play: `<svg viewBox="0 0 14 14" aria-hidden="true"><path d="M3 1.5v11l9.5-5.5z"/></svg>`, pause: `<svg viewBox="0 0 14 14" aria-hidden="true"><rect x="2.5" y="1.5" width="3.2" height="11" rx="1"/><rect x="8.3" y="1.5" width="3.2" height="11" rx="1"/></svg>` };
  const TICKS = [0, 3, 6, 9, 12, 15, 18, 21];
  function build(){
    seg.innerHTML = LEVELS.map(l => `<button type="button" role="radio" data-level="${l.id}"><span class="long">${l.label}</span><span class="short">${l.short}</span></button>`).join("");
    seg.addEventListener("click", e => { const b = e.target.closest("[data-level]"); if (b) store.set({ level: b.dataset.level }); });
    seg.addEventListener("keydown", e => {
      if (!["ArrowLeft", "ArrowRight"].includes(e.key)) return;
      const i = LEVEL_INDEX[store.get().level] + (e.key === "ArrowRight" ? 1 : -1);
      if (i >= 0 && i < LEVELS.length){ store.set({ level: LEVELS[i].id }); seg.querySelector(`[data-level="${LEVELS[i].id}"]`).focus(); }
      e.preventDefault();
    });
    const segs = [];
    SCHEDULE.forEach(e => {
      const parts = e.from <= e.to ? [[e.from, e.to]] : [[e.from, 24], [0, e.to]];
      parts.forEach(([a, b]) => segs.push(`<i title="${esc(e.label)}" style="--c:${PHASE_BY_ID[e.phase].color};left:${(a / 24 * 100).toFixed(2)}%;width:${((b - a) / 24 * 100).toFixed(2)}%"></i>`));
    });
    dayBar.innerHTML = segs.join("");
    hourBtns.innerHTML = TICKS.map(h => `<button type="button" data-h="${h}" style="left:calc(10px + (100% - 20px) * ${(h / 24).toFixed(4)})" aria-label="${fmtTime(h)}">${pad2(h)}</button>`).join("");
    hourBtns.addEventListener("click", e => { const b = e.target.closest("[data-h]"); if (b) store.set({ hour: +b.dataset.h, playing: false }); });
    range.addEventListener("input", () => store.set({ hour: +range.value, playing: false }));
    play.addEventListener("click", () => store.set({ playing: !store.get().playing }));
    back.addEventListener("click", () => store.set({ topic: null }));
    document.addEventListener("keydown", e => { if (e.key === "Escape" && store.get().topic) store.set({ topic: null }); });
  }
  function sync(s){
    seg.querySelectorAll("[data-level]").forEach(b => { const on = b.dataset.level === s.level; b.setAttribute("aria-checked", on); b.tabIndex = on ? 0 : -1; });
    if (document.activeElement !== range) range.value = wrapH(s.hour).toFixed(2);
    const hh = wrapH(s.hour), tick = (Math.round(hh / 3) * 3) % 24, phase = PHASE_BY_ID[phaseAt(hh)];
    hourBtns.querySelectorAll("[data-h]").forEach(b => b.setAttribute("aria-current", +b.dataset.h === tick));
    play.innerHTML = s.playing ? icons.pause : icons.play;
    play.setAttribute("aria-label", s.playing ? "Pause" : "Play the day");
    range.setAttribute("aria-valuetext", `${fmtTime(hh)}, ${phase.label}`);
    back.classList.toggle("on", !!s.topic);
    $(".moment").classList.toggle("off", !!s.topic);
    const t = fmtTime(hh);
    if ($("#mTime").textContent !== t) $("#mTime").textContent = t;
    if ($("#mPhase").textContent !== phase.label) $("#mPhase").textContent = phase.label;
    const note = HOUR_NOTES[Math.floor(hh)];
    if ($("#mNote").textContent !== note) $("#mNote").textContent = note;
  }
  return { build, sync };
})();

/* =========================================================================
   WIRING
   ========================================================================= */
function cameraFor(s){
  if (!s.topic) return Camera.homeView();
  const t = Topics.get(s.topic), p = Scene.focusPoints[s.topic], k = t.pull || 0, c = CONFIG.focusCenter;
  return Camera.focusView({ x: lerp(p.x, c.x, k), y: lerp(p.y, c.y, k) }, t.zoom || 300);
}

store.subscribe((s, prev) => {
  if (s.hour !== prev.hour){ Scene.update(s.hour); Vitals.update(Physio.at(s.hour), s.hour); }
  if (s.level !== prev.level) storage.set("bodyday.level", s.level);
  if (s.topic !== prev.topic){
    Camera.go(cameraFor(s)); Hotspots.setVisible(!s.topic); Scene.focus(s.topic);
    if (s.topic && !prev.topic && window.matchMedia("(max-width: 860px)").matches){
      setTimeout(() => {
        const r = $("#panel").getBoundingClientRect();
        if (r.top > window.innerHeight * .7) window.scrollTo({ top: window.scrollY + r.top - window.innerHeight * .38, behavior: reducedMotion ? "auto" : "smooth" });
      }, reducedMotion ? 0 : 900);
    }
  }
  Controls.sync(s);
  Panel.render(s);
});

function init(){
  Scene.build();
  Particles.init();
  Hotspots.build();
  Controls.build();
  const s = store.get();
  Scene.update(s.hour);
  Vitals.update(Physio.at(s.hour), s.hour);
  Controls.sync(s);
  Panel.render(s, true);
  requestAnimationFrame(() => { Camera.go(cameraFor(s), true); Hotspots.place(); });

  let resizeT;
  new ResizeObserver(() => { clearTimeout(resizeT); resizeT = setTimeout(() => { Camera.go(cameraFor(store.get()), true); }, 60); }).observe($("#sceneWrap"));

  let last = performance.now();
  function frame(t){
    const dt = Math.min(.05, (t - last) / 1000); last = t;
    const st = store.get();
    if (st.playing) store.set({ hour: (st.hour + dt * CONFIG.hoursPerSecond) % 24 });
    if (Camera.tick(t)) Hotspots.place();
    if (!document.hidden){
      const ph = Physio.at(store.get().hour);
      Rhythm.tick(dt, ph);
      Scene.animate();
      Vitals.tick(dt);
      Particles.tick(dt);
      Panel.tick(dt, ph);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
init();
})();
</script>
