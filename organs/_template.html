<!--
================================================================================
 HUMANPHYSIOLOGY — ORGAN DEEP-DIVE PAGE (the template every organ page copies)
================================================================================
 Each organ gets one standalone file, organs/<id>.html, that opens on its own
 (file:// or a web server, no build step) and links back into ../index.html.
 Copy this file to start a new organ. A page has four parts:

 1. ENGINE CSS + ENGINE JS   Identical in every organ page, between the
    "ORGAN ENGINE … BEGIN/END" markers. Edit them HERE, in _template.html, then
    run `node organs/sync-engine.mjs` to copy them into every organ page
    (`--check` only reports pages that are out of date).

 2. DATA (JSON blocks; the schema is the contract)
    #organ-meta      {id, name, mainTopic, kicker, blurb, stats:[{id,label,unit}],
                      see:[{href, label}] (links to related organ pages)}
    #organ-content   {phases:{sleep|rest|meal|exercise: levels},
                      sections:{<id>:{nav, kicker, title, intro: levels, …}},
                      parts:{<id>:{name, kind, systems:[sys], related:[part],
                             link?:{href, label}, …levels}},
                      lens:{<system id>: levels},
                      alter:{title, healthy, notes:{<key>: levels with {placeholders}},
                             scenarios:[{id, name, params:{key: value, hour?}, …levels}]}
                      (optional, for the changes bar), …anything the organ needs}
                     "levels" = {ms, hs, college, phd}. Missing levels fall back
                     to the nearest lower one (then the nearest higher).
                     Any text value may instead be keyed by phase first:
                     {rest:{ms…}, exercise:{ms…}}; the current phase is picked.
    #organ-glossary  {term: {def, match:[forms]}}: auto-linked, with tooltips.

 3. MARKUP           <section class="sec" id="<section id>" data-section> with
    [data-title] / [data-kicker] / [data-text="path.in.content"] slots the engine
    fills (and refills when the level or phase changes), a figure holding SVG
    elements tagged data-part="<part id>" (hover = name, click = select) and an
    [data-inspector] that shows the selected part. [data-lens] renders the
    body-systems lens. Text paths are dot paths into #organ-content.

 4. ORGAN SCRIPT     Uses window.OrganPage (the engine API):
      state() / set(patch) / subscribe(fn(state, prev))     the store
         {level, phase, hour, speed, paused, sel:{<section>: part id}}
      text(value) → string    level- and phase-aware text with glossary links
      get(path)               a value from #organ-content
      onTick(fn(dt, realDt))  animation; dt is scaled by the speed control and
                              is 0 while paused
      visible(el)             is el on screen (skip drawing when not)
      bindParts(root)         wire up data-part elements added after start()
      select(section, part)   select a part from code
      choice(el, {options:[[value,label]], value, onChange})  segmented control
      setStat(id, value, sub) update a hero stat tile
      vitals()                typical vitals for the current phase
      color(name)             a CSS custom property, theme-aware
      href(params)            a link into the main page (../index.html?…)
      tip(node, html, x, y) / untip(node)   the shared tooltip
      inspector(box, fn(id, part) → html)  extra HTML under a part's text
      el(tag, attrs, parent)  SVG element helper; esc(s) escapes HTML
      fill(value, vars)       like text(), with {name} placeholders filled in
      alter(spec) / altered() the changes bar: list what the reader has changed,
                              which other sections each change reaches, and a
                              "because of …" note in each of those sections; the
                              changes go into the URL so a set-up can be shared.
                              See the comment above alter() for the spec.
      exportData(fn → [{name, columns, rows}])   extra CSV tables for the Export
                              menu (columns carry units: "Pressure (mmHg)")
      exportLengths(fn → [{id, label, seconds}])  animation lengths (one beat…)
    and ends with OrganPage.start().

 5. EXPORT           The Export menu (EXPORT ENGINE blocks, synced like the organ
    engine, also into ../index.html) finds every svg[role=img] and
    canvas[aria-label] with an id inside a section; give each a short
    data-export-name. Canvases should be sized by a helper that reads
    window.__exportDpr before devicePixelRatio and sets node.__fit = fit, so
    PNGs and videos are drawn at the export resolution, not upscaled. While
    exporting, the engine holds the clock, steps the ticks itself and
    visible() is true for every figure. tests/export-check.mjs checks it all.

 6. REPORT A PROBLEM The REPORTER CSS / JS blocks (synced like the others, also into
    ../index.html) add the "Report this" button on selected text and the form
    behind [data-report] buttons. The engine tells it the page's settings in
    start(); see the comment at the top of the REPORTER JS block.

 Integration with the main page
    ../index.html lists finished organ pages in ORGAN_PAGES (topic → file) and
    shows "Explore in depth" on that organ's card, passing ?level=&hour=.
    This page links back with ?topic=<mainTopic>&level=&hour=, and the lens
    cards with ?live=<system>&level=&hour= so that system is animated.
    The reading level is shared through localStorage ("humanphysiology.level").

 Values are typical for a healthy adult and simplified for teaching; this is
 not medical advice.
================================================================================
-->
<style>
/* ===== ORGAN ENGINE CSS · BEGIN (edit in organs/_template.html, then run node organs/sync-engine.mjs) ===== */
:root{
  --bg:#EFEAE5; --surface:#F8F5F1; --surface-2:#E6DFD8; --ink:#261D1B; --muted:#6D615B;
  --line:#DCD2C9; --line-strong:#A99B91;
  --skin:#EBCDB6; --skin-line:#C9A186; --vessel:#C2414B; --vein:#4F5FB0; --nerve:#C99318;
  --accent:#2f8f83; --sel:#d9a21b;
  --serif:"Literata", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --sans:"Schibsted Grotesk", "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151210; --surface:#1C1815; --surface-2:#29221E; --ink:#EEE6DE; --muted:#A8998F;
    --line:#342B26; --line-strong:#5A4B42;
    --skin:#5E4A3F; --skin-line:#86695A; --vessel:#E0606A; --vein:#8090E0; --nerve:#E8BC45;
    --accent:#4fb3a6; --sel:#f0c040;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#151210; --surface:#1C1815; --surface-2:#29221E; --ink:#EEE6DE; --muted:#A8998F;
  --line:#342B26; --line-strong:#5A4B42;
  --skin:#5E4A3F; --skin-line:#86695A; --vessel:#E0606A; --vein:#8090E0; --nerve:#E8BC45;
  --accent:#4fb3a6; --sel:#f0c040;
  color-scheme: dark;
}
*,*::before,*::after{ box-sizing:border-box; }
html{ scroll-padding-top:120px; }
body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased; overflow-x:hidden; }
button{ font:inherit; color:inherit; }
a{ color:inherit; }
:focus-visible{ outline:2px solid var(--ink); outline-offset:2px; border-radius:4px; }
.wrap{ max-width:1240px; margin:0 auto; padding:0 24px; }

/* header */
.op-top{ position:sticky; top:0; z-index:20; background:color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); border-bottom:1px solid var(--line); }
.op-bar{ display:flex; align-items:center; gap:14px; padding-top:10px; padding-bottom:10px; flex-wrap:wrap; }
.op-back{ display:inline-flex; align-items:center; gap:6px; text-decoration:none; border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:6px 13px 6px 10px; font-size:13px; font-weight:500; white-space:nowrap; }
.op-back:hover{ background:var(--surface-2); }
.op-name{ font-family:var(--serif); font-size:19px; font-weight:500; margin:0; letter-spacing:-.01em; white-space:nowrap; }
.op-ctrls{ margin-left:auto; display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.op-ctl{ display:flex; align-items:center; gap:7px; }
.op-ctl > span{ font-size:12px; color:var(--muted); }
.seg{ display:inline-flex; background:var(--surface-2); border-radius:999px; padding:3px; flex-wrap:wrap; }
.seg button{ border:0; background:transparent; padding:5px 11px; border-radius:999px; cursor:pointer; font-size:12.5px; font-weight:500; color:var(--muted); white-space:nowrap; transition:background .2s, color .2s; }
.seg button[aria-checked="true"]{ background:var(--surface); color:var(--ink); box-shadow:0 0 0 1px var(--line); }
.seg .s{ display:none; }
.op-play{ border:1px solid var(--line); background:var(--surface); border-radius:999px; width:32px; height:32px; display:grid; place-items:center; cursor:pointer; padding:0; }
.op-nav{ display:flex; gap:4px; overflow-x:auto; padding-bottom:8px; scrollbar-width:none; }
.op-nav::-webkit-scrollbar{ display:none; }
.op-nav a{ text-decoration:none; font-size:13px; font-weight:500; color:var(--muted); padding:5px 11px; border-radius:999px; white-space:nowrap; }
.op-nav a:hover{ color:var(--ink); background:var(--surface-2); }
.op-nav a[aria-current="true"]{ color:var(--ink); background:var(--surface); box-shadow:0 0 0 1px var(--line); }

/* hero */
.hero{ padding-top:36px; padding-bottom:12px; display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); gap:32px; align-items:end; }
.kicker{ margin:0 0 6px; font-size:12px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
.hero h1{ font-family:var(--serif); font-weight:400; font-size:clamp(34px, 5vw, 58px); line-height:1.02; letter-spacing:-.025em; margin:0 0 12px; text-wrap:balance; }
.hero .lede{ font-family:var(--serif); font-size:18px; line-height:1.5; margin:0; color:var(--ink); max-width:62ch; text-wrap:pretty; }
.now{ background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:16px 18px; }
.now-head{ display:flex; align-items:center; gap:8px; margin:0 0 6px; font-size:13px; font-weight:600; }
.now-head i{ width:9px; height:9px; border-radius:50%; background:var(--pc, var(--accent)); }
.now p.t{ margin:0 0 12px; font-size:14px; color:var(--muted); }
.stats{ display:grid; grid-template-columns:repeat(auto-fit, minmax(96px, 1fr)); gap:8px; }
.stat{ background:var(--bg); border-radius:10px; padding:8px 10px; min-width:0; }
.stat .l{ font-size:11px; color:var(--muted); font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.stat .v{ font-family:var(--serif); font-size:22px; line-height:1.1; font-variant-numeric:tabular-nums; }
.stat .v small{ font-family:var(--sans); font-size:11px; color:var(--muted); margin-left:3px; }
.stat .u{ font-size:11px; color:var(--muted); }

/* sections */
.sec{ padding-top:44px; padding-bottom:20px; border-top:1px solid var(--line); margin-top:28px; }
.sec-head{ max-width:760px; margin-bottom:20px; }
.sec h2{ font-family:var(--serif); font-weight:400; font-size:clamp(26px, 3.4vw, 38px); line-height:1.1; letter-spacing:-.02em; margin:0 0 10px; }
.sec h3{ font-size:14px; font-weight:600; margin:0 0 6px; }
.prose{ font-family:var(--serif); font-size:16.5px; line-height:1.6; margin:0; text-wrap:pretty; }
.prose + .prose{ margin-top:10px; }
.muted{ color:var(--muted); }
.small{ font-size:13px; }
.sec-grid{ display:grid; grid-template-columns:minmax(0,1.35fr) minmax(280px,1fr); gap:24px; align-items:start; }
.sec-grid.wide{ grid-template-columns:minmax(0,1fr); }
.panel{ background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:16px; min-width:0; }
.panel + .panel{ margin-top:14px; }
.side{ position:sticky; top:calc(var(--op-stick, 104px) + 12px); min-width:0; }
.fig{ position:relative; min-width:0; }
.fig svg{ display:block; width:100%; height:auto; }
.fig-tools{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:10px; }
.fig-tools > span{ font-size:12px; color:var(--muted); }
.cap{ font-size:12.5px; color:var(--muted); margin:8px 2px 0; }

/* parts: anything tagged data-part in a figure */
[data-part]{ cursor:pointer; transition:filter .2s, opacity .2s; }
[data-part]:hover{ filter:brightness(1.12) saturate(1.15); }
[data-part]:focus{ outline:none; }
[data-part]:focus-visible{ filter:drop-shadow(0 0 3px var(--sel)); }
.is-sel{ filter:drop-shadow(0 0 2.5px var(--sel)) drop-shadow(0 0 2px var(--sel)) !important; }
.tip{ position:fixed; z-index:50; pointer-events:none; background:var(--ink); color:var(--surface); font-size:12.5px; line-height:1.35; padding:6px 9px; border-radius:8px; max-width:260px; opacity:0; transform:translateY(4px); transition:opacity .15s, transform .15s; }
.tip.on{ opacity:1; transform:none; }
.tip b{ font-weight:600; }

/* inspector */
.insp-kind{ margin:0 0 2px; font-size:11px; font-weight:600; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); }
.insp h3{ font-family:var(--serif); font-size:22px; font-weight:400; margin:0 0 8px; letter-spacing:-.01em; }
.insp .prose{ font-size:15.5px; }
.insp-empty{ color:var(--muted); font-size:14px; margin:0; }
.chips{ display:flex; gap:6px; flex-wrap:wrap; margin-top:12px; }
.chip{ border:1px solid var(--line-strong); background:transparent; border-radius:999px; padding:5px 11px; font-size:12.5px; font-weight:500; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; gap:6px; }
.chip:hover{ background:var(--surface-2); }
.chip[aria-pressed="true"], .chip.on{ background:var(--ink); color:var(--surface); border-color:var(--ink); }
.chip i{ width:8px; height:8px; border-radius:50%; background:var(--c, var(--muted)); flex:none; }
.lvl{ display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--muted); margin:0 0 8px; }
.pips{ display:inline-flex; gap:3px; }
.pips b{ width:6px; height:6px; border-radius:50%; background:var(--line-strong); }
.pips b.on{ background:var(--ink); }

/* body-systems lens */
.lens{ display:grid; grid-template-columns:repeat(auto-fill, minmax(270px, 1fr)); gap:12px; }
.lens-card{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px 16px 14px; border-top:4px solid var(--c); display:flex; flex-direction:column; }
.lens-card h3{ display:flex; align-items:center; gap:8px; font-size:15px; margin:0 0 6px; }
.lens-card .prose{ font-size:15px; flex:1; }
.lens-card .chips{ margin-top:12px; }

/* changes bar: what the reader has altered, and which sections each change reaches */
.op-alter{ position:sticky; top:var(--op-top-h, 0px); z-index:19; background:color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); border-bottom:1px solid var(--line); }
.op-alter-in{ display:flex; align-items:center; gap:8px 12px; padding-top:7px; padding-bottom:7px; flex-wrap:wrap; min-height:44px; }
.alt-title{ margin:0; font-size:13px; font-weight:600; white-space:nowrap; display:flex; align-items:center; gap:7px; }
.alt-title i{ width:9px; height:9px; border-radius:50%; background:var(--accent); flex:none; }
.op-alter.has .alt-title i{ background:var(--sel); }
.alt-empty{ margin:0; font-size:13px; color:var(--muted); flex:1; min-width:0; }
.alt-list{ list-style:none; margin:0; padding:0; display:flex; gap:6px; flex-wrap:wrap; flex:1; min-width:0; }
.alt{ display:inline-flex; align-items:center; border:1px solid var(--line-strong); background:var(--surface); border-radius:999px; font-size:12.5px; white-space:nowrap; }
.alt-go{ border:0; background:transparent; padding:4px 4px 4px 11px; font-weight:600; cursor:pointer; }
.alt-to{ color:var(--muted); padding:4px 2px 4px 4px; }
.alt-to a{ color:var(--muted); text-decoration:none; border-bottom:1px dotted var(--line-strong); }
.alt-to a:hover{ color:var(--ink); border-bottom-color:var(--ink); }
.alt-x{ border:0; background:transparent; cursor:pointer; width:26px; height:26px; border-radius:50%; display:grid; place-items:center; color:var(--muted); padding:0; margin-right:1px; }
.alt-x:hover{ background:var(--surface-2); color:var(--ink); }
.alt-act{ display:flex; gap:6px; margin-left:auto; }
.alt-btn{ border:1px solid var(--line-strong); background:transparent; border-radius:999px; padding:4px 11px; font-size:12.5px; font-weight:500; cursor:pointer; white-space:nowrap; }
.alt-btn:hover{ background:var(--surface-2); }
.alt-btn.strong{ background:var(--ink); color:var(--surface); border-color:var(--ink); }
.alt-scen{ border-top:1px solid var(--line); padding-top:10px; padding-bottom:12px; }
.alt-scen[hidden]{ display:none; }
.alt-scen-h{ margin:0 0 8px; font-size:12px; color:var(--muted); }
.alt-scen-list{ display:grid; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr)); gap:8px; }
.alt-scen-list button{ text-align:left; border:1px solid var(--line); background:var(--bg); border-radius:12px; padding:8px 11px; cursor:pointer; font-size:13px; line-height:1.35; }
.alt-scen-list button:hover{ border-color:var(--line-strong); background:var(--surface-2); }
.alt-scen-list button[aria-pressed="true"]{ border-color:var(--ink); box-shadow:0 0 0 1px var(--ink); }
.alt-scen-list b{ display:block; font-size:13px; margin-bottom:2px; }
.alt-scen-list span{ color:var(--muted); font-size:12.5px; }
.delta{ font-family:var(--sans); font-size:11px; font-weight:500; color:var(--muted); margin-left:4px; white-space:nowrap; }
.ro .delta{ display:block; margin:1px 0 0; line-height:1.2; }
.because:empty{ display:none; }
.because{ display:grid; gap:8px; margin-top:14px; }
.because-note{ background:var(--surface); border:1px solid var(--line); border-left:3px solid var(--sel); border-radius:10px; padding:9px 12px; font-family:var(--serif); font-size:15px; line-height:1.5; }
.because-from{ display:block; font-family:var(--sans); font-size:11.5px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); margin-bottom:2px; }
.because-from a{ color:var(--ink); text-decoration:none; border-bottom:1px dotted var(--line-strong); text-transform:none; letter-spacing:0; font-size:12.5px; }

/* glossary terms */
.term{ border-bottom:1px dotted var(--line-strong); cursor:help; }
.term:hover, .term:focus{ border-bottom-color:var(--ink); outline:none; }

.foot{ border-top:1px solid var(--line); margin-top:40px; padding-top:20px; padding-bottom:40px; color:var(--muted); font-size:13px; display:flex; gap:16px; flex-wrap:wrap; justify-content:space-between; }

@media (max-width: 980px){
  .hero{ grid-template-columns:minmax(0,1fr); gap:18px; }
  .sec-grid{ grid-template-columns:minmax(0,1fr); }
  .side{ position:static; }
}
@media (max-width: 640px){
  .wrap{ padding:0 16px; }
  .op-top{ position:static; }
  .op-name{ display:none; }
  .op-ctrls{ margin-left:0; width:100%; }
  .seg .s{ display:inline; } .seg .f{ display:none; }
  .op-ctl > span{ display:none; }
  .hero{ padding-top:22px; }
  html{ scroll-padding-top:12px; }
  .op-alter.empty{ position:static; }
  .op-alter-in{ flex-wrap:nowrap; }
  .alt-list{ flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; }
  .alt-list::-webkit-scrollbar{ display:none; }
  .alt-title span, .alt-to, .alt-btn[data-alt-share]{ display:none; }
  .alt-scen-list{ max-height:50vh; overflow-y:auto; }
}
@media (prefers-reduced-motion: reduce){ *{ transition:none !important; animation:none !important; } }
/* ===== ORGAN ENGINE CSS · END ===== */
/* ===== EXPORT ENGINE CSS · BEGIN (edit in organs/_template.html, then run node organs/sync-engine.mjs) ===== */
.xp-btn{ display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:6px 12px 6px 10px; font:inherit; font-size:13px; font-weight:500; color:var(--ink); cursor:pointer; white-space:nowrap; min-height:32px; }
.xp-btn:hover{ background:var(--surface-2); }
.xp-btn[aria-expanded="true"]{ background:var(--ink); color:var(--surface); border-color:var(--ink); }
.xp{ position:fixed; z-index:60; width:min(400px, calc(100vw - 16px)); overflow-y:auto; overscroll-behavior:contain; background:var(--surface); color:var(--ink); border:1px solid var(--line-strong); border-radius:16px; box-shadow:0 18px 48px rgba(0,0,0,.18), 0 2px 8px rgba(0,0,0,.08); padding:14px 16px 12px; font-family:var(--sans); font-size:14px; line-height:1.4; }
.xp[hidden]{ display:none; }
.xp.sheet{ left:0; right:0; bottom:0; top:auto !important; width:auto; max-height:82vh !important; border-radius:18px 18px 0 0; border-bottom:0; padding-bottom:calc(14px + env(safe-area-inset-bottom, 0px)); }
.xp-head{ display:flex; align-items:center; justify-content:space-between; margin:0 0 8px; }
.xp-head h2{ font-family:var(--serif); font-size:20px; font-weight:500; margin:0; letter-spacing:-.01em; }
.xp-x{ border:0; background:transparent; width:32px; height:32px; border-radius:50%; display:grid; place-items:center; cursor:pointer; color:var(--muted); padding:0; }
.xp-x:hover{ background:var(--surface-2); color:var(--ink); }
.xp-field{ display:grid; gap:4px; margin:0 0 4px; }
.xp-field > span, .xp-opt > span{ font-size:12px; color:var(--muted); font-weight:500; }
.xp select{ font:inherit; font-size:13.5px; color:var(--ink); background:var(--bg); border:1px solid var(--line-strong); border-radius:10px; padding:7px 9px; min-height:36px; width:100%; min-width:0; }

<script>
/* ===== REPORTER JS · BEGIN (edit in organs/_template.html, then run node organs/sync-engine.mjs) ===== */
/* Report an issue, linked to the text and the settings on screen.
   Select any text and press "Report", or press a [data-report] button. The short form
   files a GitHub issue (.github/ISSUE_TEMPLATE/report.yml) carrying:
     the selected text and the words around it, the JSON key(s) it comes from
     (found by searching this page's <script type="application/json"> blocks),
     the section and heading it sits under, the page's settings, and a link
     that reopens the page as the reader saw it.
   The JSON context block lets whoever fixes the issue find the text and
   reopen the page in the reader's state. A page describes its settings with
     HPReport.provide(() => ({ label, settings, changes, query }))
   label: where the reader is, in words; settings: the state as plain JSON;
   changes: what the reader has altered, in words; query: URL parameters that
   restore that state. With ENDPOINT set, reports are POSTed there (a relay
   that files issues without a GitHub account); otherwise GitHub opens prefilled. */
window.HPReport = (() => {
"use strict";
const REPO = "drtomforce/HumanPhysiology";
const SITE = "https://drtomforce.github.io/HumanPhysiology/";
const TEMPLATE = "report.yml";
const ENDPOINT = "";
const SCHEMA = 1;
const MAX_URL = 7600; /* GitHub refuses much longer new-issue URLs */
/* [id, label (must match the dropdown in report.yml), hint] */
const CATEGORIES = [
  ["factual", "Factual error", "Something here is wrong. Say what is right, and how you know."],
  ["level", "Wrong for this reading level", "Too hard, too simple or misleading at this reading level."],
  ["wording", "Typo or wording", "A spelling or grammar slip, or a sentence that is hard to follow."],
  ["visual", "Visual or animation bug", "Something looks or moves wrong. Say what you expected to see."],
  ["broken", "Something doesn't work", "A button, slider or link misbehaves. Say what you pressed."],
  ["suggestion", "Suggestion", "An idea to make this better."]
];
const FLAG = `<svg width="13" height="13" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 13V1.8M3 2.2h7.6l-1.8 3 1.8 3H3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const squash = s => String(s).replace(/\s+/g, " ").trim();
/* the same folding on both sides, so rendered text matches its JSON source */
const norm = s => squash(String(s).replace(/<[^>]+>/g, " ").replace(/[‘’ʼ′]/g, "'").replace(/[“”″]/g, '"').replace(/[‐-―−]/g, "-").replace(/ /g, " ")).toLowerCase();

let provider = () => ({});
function provide(fn){ provider = fn; }
function pageCtx(){ try { return provider() || {}; } catch(e){ return { error: String(e) }; } }
function pagePath(){
  const p = location.pathname, i = p.lastIndexOf("/organs/");
  if (i >= 0) return p.slice(i + 1);
  const f = p.slice(p.lastIndexOf("/") + 1);
  return f && f.endsWith(".html") ? f : "index.html";
}

/* ---------- where the selected text comes from ---------- */
let blocks = null;
function jsonBlocks(){
  if (!blocks) blocks = [...document.querySelectorAll('script[type="application/json"][id]')].map(n => {
    try { return [n.id, JSON.parse(n.textContent)]; } catch(e){ return null; }
  }).filter(Boolean);
  return blocks;
}
function find(q, level){
  const out = [];
  const walk = (v, path, id) => {
    if (out.length >= 12) return;
    if (typeof v === "string"){ if (norm(v).includes(q)) out.push(`${id}:${path.join(".")}`); }
    else if (v && typeof v === "object") for (const k of Object.keys(v)) walk(v[k], [...path, k], id);
  };
  jsonBlocks().forEach(([id, d]) => walk(d, [], id));
  /* keys at the reader's level first */
  return level ? out.sort((a, b) => (b.endsWith("." + level) - a.endsWith("." + level))) : out;
}
function locate(text, level){
  const q = norm(text);
  if (q.length < 3) return { match: "none", keys: [] };
  let keys = find(q, level);
  if (keys.length) return { match: "exact", keys };
  /* filled-in numbers or a selection across several blocks: try the longest plain runs */
  const runs = q.split(/[0-9.,;:!?()%·•]+/).map(x => x.trim()).filter(x => x.length >= 14).sort((a, b) => b.length - a.length).slice(0, 3);
  for (const r of runs){ keys = find(r, level); if (keys.length) return { match: "partial", fragment: r, keys }; }
  return { match: "none", keys: [] };
}
function cssPath(node){
  const out = [];
  for (let n = node; n && n.nodeType === 1 && n !== document.body && out.length < 5; n = n.parentElement){
    let s = n.tagName.toLowerCase();
    if (n.id){ out.unshift(s + "#" + n.id); break; }
    const cls = [...n.classList].filter(c => !/^(on|off|has|empty|dim)$/.test(c)).slice(0, 2);
    if (cls.length) s += "." + cls.join(".");
    out.unshift(s);
  }
  return out.join(" > ");
}
function whereIs(node){
  const sec = node.closest("[data-section]") || node.closest("section[id], aside[id], [id]");
  const scope = node.closest("[data-section], section, aside, article, .card, dialog") || document.body;
  let heading = "";
  for (const h of scope.querySelectorAll("h1, h2, h3, h4")){
    if (h.compareDocumentPosition(node) & Node.DOCUMENT_POSITION_FOLLOWING || h.contains(node)) heading = squash(h.textContent);
  }
  return { section: sec ? sec.id : "", dataSection: !!(sec && sec.hasAttribute("data-section")), heading: heading.slice(0, 120), element: cssPath(node) };
}

/* ---------- the selection and the floating button ---------- */
function selection(){
  const s = getSelection();
  if (!s || s.isCollapsed || !s.rangeCount) return null;
  const r = s.getRangeAt(0), text = squash(s.toString());
  if (text.length < 2) return null;
  let node = r.commonAncestorContainer;
  if (node.nodeType !== 1) node = node.parentElement;
  if (!node || node.closest(".hpr-dlg, input, textarea, select, [contenteditable]")) return null;
  return { r, text, node };
}
function capture(sel){
  if (!sel) return { text: "", where: { section: "", heading: "", element: "" } };
  const { r, node } = sel;
  const block = node.closest("p, li, dd, td, blockquote, figcaption, h1, h2, h3, h4, [data-text], [data-section], section, aside") || node;
  let before = "", after = "", raw = r.toString();
  try {
    const a = document.createRange(); a.selectNodeContents(block); a.setEnd(r.startContainer, r.startOffset); before = a.toString();
    const b = document.createRange(); b.selectNodeContents(block); b.setStart(r.endContainer, r.endOffset); after = b.toString();
  } catch(e){}
  /* a selection that cuts a word in half reports the whole word */
  const W = /[\p{L}\p{N}’'-]/u;
  const head = W.test(raw[0] || "") ? (before.match(/[\p{L}\p{N}’'-]+$/u) || [""])[0] : "";
  const tail = W.test(raw[raw.length - 1] || "") ? (after.match(/^[\p{L}\p{N}’'-]+/u) || [""])[0] : "";
  raw = head + raw + tail; before = before.slice(0, before.length - head.length); after = after.slice(tail.length);
  return { text: squash(raw).slice(0, 1500), before: squash(before).slice(-160), after: squash(after).slice(0, 160), where: whereIs(node) };
}
let fab = null, fabSel = null, fabTimer = 0;
function placeFab(){
  const sel = selection();
  fabSel = sel;
  if (!sel || (dlg && dlg.open)){ fab.classList.remove("on"); return; }
  const rects = sel.r.getClientRects(), last = rects[rects.length - 1] || sel.r.getBoundingClientRect();
  const w = fab.offsetWidth || 90, h = fab.offsetHeight || 30;
  let x = last.right - w / 2, y = last.bottom + 10;
  if (y + h > innerHeight - 8) y = Math.max(8, last.top - h - 10);
  x = Math.max(8, Math.min(innerWidth - w - 8, x));
  fab.style.left = x + "px"; fab.style.top = y + "px";
  fab.classList.add("on");
}
function buildFab(){
  fab = document.createElement("button");
  fab.type = "button"; fab.className = "hpr-fab"; fab.innerHTML = `${FLAG}Report this`;
  fab.setAttribute("aria-label", "Report a problem with the selected text");
  /* keep the selection alive while the button is pressed */
  fab.addEventListener("pointerdown", e => e.preventDefault());
  fab.addEventListener("mousedown", e => e.preventDefault());
  fab.addEventListener("click", () => { const s = fabSel || selection(); fab.classList.remove("on"); open(s); });
  document.body.appendChild(fab);
  const later = () => { clearTimeout(fabTimer); fabTimer = setTimeout(placeFab, 180); };
  document.addEventListener("selectionchange", later);
  addEventListener("scroll", () => { if (fab.classList.contains("on")) placeFab(); }, { passive: true, capture: true });
  addEventListener("resize", later);
}

/* ---------- the form ---------- */
let dlg = null, report = null;
function buildDialog(){
  dlg = document.createElement("dialog");
  dlg.className = "hpr-dlg"; dlg.setAttribute("aria-labelledby", "hprTitle");
  document.body.appendChild(dlg);
  dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); }); /* backdrop */
  dlg.addEventListener("close", () => { report = null; });
}
function renderForm(){
  const c = report, sel = c.selection, ctx = c.page;
  const settings = Object.entries(ctx.settings || {}).filter(([, v]) => v !== null && v !== "" && !(typeof v === "object" && !Object.keys(v).length))
    .map(([k, v]) => `${k}: ${typeof v === "object" ? JSON.stringify(v) : v}`).join(" · ");

    const cfg = { codec, width: w, height: h, bitrate, framerate: fps };
    let ok = false; try { ok = (await VideoEncoder.isConfigSupported(cfg)).supported; } catch(e){}
    if (!ok) continue;

      output: ch => { const b = new Uint8Array(ch.byteLength); ch.copyTo(b); chunks.push({ t: ch.timestamp / 1000, key: ch.type === "key", data: b }); },
      error: e => { err = e; }

      async add(cv, i){

/* ---------- GIF: one median-cut palette for the whole clip, LZW, looping ---------- */
function medianCut(hist, n){

    boxes.forEach((b, i) => {

        for (const c of b){ if (c[a] < lo) lo = c[a]; if (c[a] > hi) hi = c[a]; cnt += c[3]; }
        const score = (hi - lo) * Math.sqrt(cnt);
        if (score > best){ best = score; bi = i; axis = a; }

    if (bi < 0) break;
    const b = boxes[bi].sort((p, q) => p[axis] - q[axis]);
    let tot = 0; for (const c of b) tot += c[3];
    /* cut after the colour that crosses half the weight, but always leave both halves something:
       a dominant colour sorted last (the background, say) is split off on its own, instead of the
       first colour being peeled off one split at a time, which spent the palette on dark edge
       pixels and left small regions such as the blue heart chambers averaged into purple */
    let acc = 0, cut = b.length - 1;
    for (let i = 0; i < b.length; i++){ acc += b[i][3]; if (acc >= tot / 2){ cut = Math.min(b.length - 1, Math.max(1, i + 1)); break; } }
    boxes.splice(bi, 1, b.slice(0, cut), b.slice(cut));

    let r = 0, g = 0, bl = 0, c = 0;
    for (const x of b){ r += x[0] * x[3]; g += x[1] * x[3]; bl += x[2] * x[3]; c += x[3]; }
    return [r / c * 255 / 31, g / c * 255 / 31, bl / c * 255 / 31].map(v => Math.round(Math.min(255, v)));

  emit(clear);

    else { if (next >= (1 << size)) size++; dict.set(key, next++); }

/* ---------- recording ---------- */
let job = null;
async function record(f, o, kind){
  if (job) return;
  const clock = A.clock || {}, speed = Math.max(.01, clock.speed ? clock.speed() : 1);
  const len = o.length, ride = len.ride ? (A.ride && A.ride()) : null;
  if (len.ride && !ride){ status("There is no journey running to record. Start one first.", true); return; }
  const gif = kind === "gif", delay = gif ? Math.max(4, Math.round(100 / Math.min(o.fps, 20))) : 0, fps = gif ? 100 / delay : o.fps;
  const vo = { ...o, bg: kind === "frames" ? o.bg : true, even: kind === "video", scale: kind === "gif" ? Math.min(o.scale, 2) : o.scale };
  /* keep video frames inside 1920 px and GIFs small */
  const { w } = figSize(f); if (kind === "video" && w * vo.scale > 1920) vo.scale = 1920 / w;
  const max = ride ? 120 : len.seconds;
  const total = Math.max(2, Math.round(max / (ride ? 1 : speed) * fps));
  job = { cancel: false, kind };
  showJob(0, `Recording ${f.name}…`);
  let sink = null;
  try {
    await withClock(f, vo.scale, async () => {
      if (ride) ride.restart();
      if (clock.step) clock.step(0);
      const cap = await captionBitmap(f, vo);
      const cv = await frame(f, vo, null, cap);
      sink = kind === "gif" ? gifSink(Math.min(800, cv.width), delay)
        : kind === "frames" ? framesSink(fileBase(f))
        : (await webCodecsSink(cv.width, cv.height, fps)) || recorderSink(cv, fps);
      if (!sink) throw new Error("This browser can't record video. Try the GIF or the PNG frames.");
      for (let i = 0; i < total; i++){
        if (job.cancel) throw new Cancelled();
        if (i){ clock.step && clock.step(speed / fps); await frame(f, vo, cv, cap); }
        await sink.add(cv, i);
        const p = ride ? Math.max(i / total, ride.progress()) : (i + 1) / total;
        showJob(p * (gif ? .7 : .95), `Recording ${f.name}: frame ${i + 1}${ride ? "" : ` of ${total}`}`);
        if (ride && ride.done()) break;
        if (!sink.realtime && i % 3 === 2) await sleep(0);
      }
    });
    showJob(gif ? .7 : .96, gif ? "Encoding the GIF…" : "Finishing the file…");
    const blob = await sink.finish(p => showJob(.7 + .3 * p, "Encoding the GIF…"));
    save(blob, `${fileBase(f)}.${sink.ext}`);
  } catch(e){
    if (sink && sink.abort) sink.abort();
    status(e instanceof Cancelled ? "Recording cancelled." : (e && e.message) || "The recording failed.", !(e instanceof Cancelled));
  } finally { job = null; showJob(null); }
}

    <section class="xp-sec" aria-labelledby="xpAnim"><h3 id="xpAnim">Animation</h3>
      <div class="xp-opts">
        <label class="xp-opt"><span>Length</span><select data-opt-len>${lens.map(l => `<option value="${esc(l.id)}"${l.id === opt.len ? " selected" : ""}>${esc(l.label)}${l.seconds && !/^s\d+$/.test(l.id) ? ` (${fmtS(l.seconds)})` : ""}</option>`).join("")}</select></label>
        <div class="xp-opt"><span>Frames</span>${seg("fps", [[30, "30 /s"], [15, "15 /s"]], opt.fps)}</div>
      </div>
      <div class="xp-acts"><button type="button" class="xp-b" data-xp="video">Video</button><button type="button" class="xp-b" data-xp="gif">GIF</button><button type="button" class="xp-b" data-xp="frames">PNG frames (ZIP)</button></div>
      <p class="xp-note">Recorded frame by frame at the page's speed${(A.clock && A.clock.speed && A.clock.speed() !== 1) ? ` (now ${A.clock.speed()}×)` : ""}, so loops of a beat or a breath join up.${reducedMotion ? " Your device asks for reduced motion, so some movements are left out here and in the recording too." : ""}</p>
    </section>` : `<p class="xp-note">There are no figures on this view.</p>`}
    <div class="xp-job" data-xp-job hidden><div class="xp-bar"><i></i></div><span data-xp-jobtext></span><button type="button" class="xp-b" data-xp="cancel">Cancel</button></div>
    <section class="xp-sec" aria-labelledby="xpPage"><h3 id="xpPage">This view</h3>
      <div class="xp-acts">
        <button type="button" class="xp-b" data-xp="save">Save settings</button><button type="button" class="xp-b" data-xp="load">Load settings…</button>
        <button type="button" class="xp-b" data-xp="link">Copy link</button><button type="button" class="xp-b" data-xp="csv">Data (CSV)</button>
        ${figList.length > 1 ? `<button type="button" class="xp-b" data-xp="all">All figures (ZIP)</button>` : ""}
      </div>
      <p class="xp-note">A settings file brings back this exact view: level, time, systems, your changes and every control. Load one here, or drop it anywhere on the page.</p>
      <input type="file" accept="application/json,.json" data-xp-file hidden>
    </section>
    <p class="xp-status" data-xp-status role="status" aria-live="polite"></p>`;
  syncNote();
}
function current(){ const sel = $("[data-xp-fig]", menu); return figList.find(f => f.id === (sel && sel.value)) || figList[0]; }
function syncNote(){
  const n = $("[data-xp-fignote]", menu), f = current(); if (!n || !f) return;
  const svgB = $('[data-xp="svg"]', menu); if (svgB) svgB.disabled = f.canvas;
  const { w, h } = figSize(f);
  n.textContent = f.canvas ? `Drawn on a canvas: PNG only, ${Math.round(w * opt.scale)} × ${Math.round(h * opt.scale)} px.` : `Vector figure: SVG keeps it sharp at any size. PNG ${Math.round(w * opt.scale)} × ${Math.round(h * opt.scale)} px.`;
}
function status(msg, bad){
  const n = menu && $("[data-xp-status]", menu);
  if (n && !menu.hidden){ n.textContent = msg; n.classList.toggle("bad", !!bad); return; }
  toast(msg, bad);
}
let toastT = 0;
function toast(msg, bad){
  let t = $(".xp-toast");
  if (!t){ t = document.createElement("div"); t.className = "xp-toast"; t.setAttribute("role", "status"); document.body.appendChild(t); }
  t.textContent = msg; t.classList.toggle("bad", !!bad); t.classList.add("on");
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 4000);
}
function showJob(p, text){
  const box = menu && $("[data-xp-job]", menu); if (!box) return;
  box.hidden = p == null;
  $$(".xp-sec .xp-b", menu).forEach(b => { b.disabled = p != null || (b.dataset.xp === "svg" && current() && current().canvas); });
  if (p == null) return;
  $(".xp-bar i", box).style.width = (Math.max(0, Math.min(1, p)) * 100).toFixed(1) + "%";
  $("[data-xp-jobtext]", box).textContent = text || "";
}
function place(){
  if (menu.hidden) return;
  const r = btn.getBoundingClientRect(), phone = innerWidth <= 640;
  menu.classList.toggle("sheet", phone);
  if (phone){ menu.style.top = menu.style.right = ""; return; }
  const top = Math.max(8, Math.min(r.bottom + 8, innerHeight - 200));
  menu.style.top = top + "px"; menu.style.right = Math.max(8, innerWidth - r.right) + "px";
  menu.style.maxHeight = (innerHeight - top - 12) + "px";
}
function open(){
  if (!menu.hidden) return;
  renderMenu(); menu.hidden = false; btn.setAttribute("aria-expanded", "true"); place();
  const f = $("[data-xp-fig]", menu) || $(".xp-b", menu); if (f) f.focus();
}
function close(){
  if (menu.hidden) return;
  if (job){ job.cancel = true; }
  menu.hidden = true; btn.setAttribute("aria-expanded", "false"); btn.focus();
}
function saveOpt(){ store.set(OPT_KEY, JSON.stringify(opt)); }
function buildMenu(){
  btn = document.createElement("button");
  btn.type = "button"; btn.className = "xp-btn"; btn.setAttribute("aria-haspopup", "dialog"); btn.setAttribute("aria-expanded", "false");
  btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 1.5v7.5M3.8 5.8 7 9l3.2-3.2M2 10.5v1.8h10v-1.8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Export</span>`;
  (A.host || document.body).appendChild(btn);
  menu = document.createElement("div");
  menu.className = "xp"; menu.hidden = true; menu.setAttribute("role", "dialog"); menu.setAttribute("aria-labelledby", "xpTitle");
  document.body.appendChild(menu);
  btn.addEventListener("click", () => menu.hidden ? open() : close());
  addEventListener("resize", place);
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !menu.hidden){ e.preventDefault(); job ? (job.cancel = true) : close(); } });
  document.addEventListener("pointerdown", e => { if (!menu.hidden && !job && !menu.contains(e.target) && !btn.contains(e.target)) close(); });
  menu.addEventListener("change", e => {
    if (e.target.matches("[data-xp-fig]")) syncNote();
    else if (e.target.matches("[data-opt-caption]")){ opt.caption = e.target.checked; saveOpt(); }
    else if (e.target.matches("[data-opt-len]")){ opt.len = e.target.value; saveOpt(); }
    else if (e.target.matches("[data-xp-file]") && e.target.files[0]){ readFile(e.target.files[0]); e.target.value = ""; }
  });
  menu.addEventListener("click", async e => {
    const s = e.target.closest("[data-opt]");
    if (s){
      const k = s.dataset.opt, v = s.dataset.v;
      opt[k] = k === "bg" ? v === "1" : +v; saveOpt();
      $$(`[data-opt="${k}"]`, menu).forEach(b => b.setAttribute("aria-checked", String(b === s)));
      syncNote(); return;
    }
    const b = e.target.closest("[data-xp]"); if (!b || b.disabled) return;
    const act = b.dataset.xp, f = current(), o = { scale: opt.scale, bg: opt.bg, caption: opt.caption, fps: opt.fps };
    if (act === "close") return close();
    if (act === "cancel"){ if (job) job.cancel = true; return; }
    if (job) return;
    try {
      if (act === "svg" || act === "png"){ status("Drawing…"); await exportStill(f, o, act); }
      else if (act === "video" || act === "gif" || act === "frames"){ o.length = lengths().find(l => l.id === opt.len) || lengths()[0]; await record(f, o, act); }
      else if (act === "save") save(new Blob([JSON.stringify(settings(), null, 2)], { type: "application/json" }), `${fileBase()}.json`);
      else if (act === "load") $("[data-xp-file]", menu).click();
      else if (act === "link") await copyLink();
      else if (act === "csv") exportData();
      else if (act === "all") await exportAll(o);
    } catch(err){ status((err && err.message) || "The export failed.", true); }
  });
  /* drop a settings file anywhere on the page */
  let depth = 0;
  const hasFile = e => e.dataTransfer && [...e.dataTransfer.types].includes("Files");
  const veil = document.createElement("div"); veil.className = "xp-drop"; veil.innerHTML = "<p>Drop a settings file to load that view</p>"; document.body.appendChild(veil);
  addEventListener("dragenter", e => { if (!hasFile(e)) return; depth++; veil.classList.add("on"); });
  addEventListener("dragleave", e => { if (!hasFile(e)) return; if (--depth <= 0){ depth = 0; veil.classList.remove("on"); } });
  addEventListener("dragover", e => { if (hasFile(e)) e.preventDefault(); });
  addEventListener("drop", e => {
    if (!hasFile(e)) return;
    e.preventDefault(); depth = 0; veil.classList.remove("on");
    const file = [...e.dataTransfer.files].find(f => /json$/i.test(f.type) || /\.json$/i.test(f.name));
    if (file) readFile(file); else toast("Only settings files (.json) can be dropped here.", true);
  });
}

function mount(adapter){
  A = adapter;
  buildMenu();
  /* a settings file loaded on another page and handed over */
  let handed = null;
  try { handed = sessionStorage.getItem("humanphysiology.import"); if (handed) sessionStorage.removeItem("humanphysiology.import"); } catch(e){}
  if (handed){ try { const obj = JSON.parse(handed); if (obj.page === A.page.id) setTimeout(() => applySettings(obj).catch(e => toast(e.message, true)), 60); } catch(e){} }
}

return {
  mount, open, close, figures, settings, applySettings, SCHEMA, VERSION,
  /* for tests and for pages that want a file without the menu */
  svg: (id, o = {}) => { const f = figures().find(x => x.id === id); return f && !f.canvas ? composeSVG(f, { caption: true, bg: true, ...o, scale: 1 }).svg : null; },
  png: async (id, o = {}) => { const f = figures().find(x => x.id === id); if (!f) return null; o = { scale: 1, bg: true, caption: true, ...o }; return withClock(f, o.scale, async () => toBlob(await frame(f, o, null, await captionBitmap(f, o)))); },
  record: async (id, kind, o = {}) => {
    const f = figures().find(x => x.id === id); if (!f) return null;
    let blob = null;
    o = { scale: 1, bg: true, caption: true, fps: 15, length: { seconds: 1 }, ...o };
    saveHook = b => { blob = b; };
    try { await record(f, o, kind); } finally { saveHook = null; }
    return blob;
  },
  data: () => (A.data ? A.data() : []).map(t => ({ ...t, csv: csv(t) })),
  zip, csv
};
})();
/* ===== EXPORT ENGINE JS · END ===== */
</script>
<script>
/* ---------- organ script: figures, simulations and their controls ---------- */
(() => {
  const O = OrganPage;
  /* one shared model that every section reads (here, a single switch) */
  const model = { damaged: false };
  const btn = document.getElementById("demoDamage");
  const syncUI = () => btn.setAttribute("aria-pressed", String(model.damaged));
  btn.addEventListener("click", () => { model.damaged = !model.damaged; syncUI(); O.altered(); });

  /* the changes bar: list the changes, say where each one shows, put them in the URL.
     Call O.alter() before O.start(), and O.altered() after every change. */
  O.alter({
    title: () => O.get("alter.title"),
    healthy: () => O.levelText(O.get("alter.healthy")),
    items: () => model.damaged ? [{ id: "damage", section: "anatomy", label: "Organ damaged" }] : [],
    clear(id){ if (id === "damage") model.damaged = false; syncUI(); },
    reset(){ model.damaged = false; syncUI(); },
    /* a note in each OTHER section the change affects, so readers see the knock-on effect */
    notes: sec => sec === "systems" && model.damaged ? [{ cause: "damage", html: O.fill(O.get("alter.notes.damage"), { pct: 60 }) }] : [],
    toParams: () => ({ damage: model.damaged ? "1" : "" }),
    fromParams(P){ model.damaged = P.get("damage") === "1"; }
  });
  syncUI();

  O.onTick(() => O.setStat("hr", O.vitals().hr));
  O.start();
})();
</script>
